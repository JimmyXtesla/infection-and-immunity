<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Score | ScoreFlow Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
</head>
<body class="bg-slate-50 min-h-full font-sans">

    <!-- Mobile Header -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 py-2 lg:hidden">
        <div class="flex justify-between items-center">
            <a class="font-bold text-xl text-indigo-600" href="#">ScoreFlow</a>
            <button type="button" class="p-2 border rounded-lg" data-hs-overlay="#hs-sidebar-footer">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">ScoreFlow</a></header>
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5 text-sm">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="users.html">Users</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">Groups</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-800 bg-gray-100 font-bold rounded-lg" href="#">Evaluation Mode</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <header class="mb-8">
                <h1 class="text-3xl font-black text-slate-900">New Evaluation</h1>
                <p class="text-slate-500">Provide feedback based on the 8 core criteria.</p>
            </header>

            <div class="grid lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- 1. Selection Card -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Step 1: Identity</h3>
                        <div class="grid sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Target Group</label>
                                <select id="group-select" class="py-2.5 px-3 block w-full border-gray-200 rounded-lg text-sm border focus:ring-indigo-500 outline-none">
                                    <option value="">Loading Groups...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Member to Score</label>
                                <select id="member-select" class="py-2.5 px-3 block w-full border-gray-200 rounded-lg text-sm border focus:ring-indigo-500 outline-none">
                                    <option value="">Select a Group First</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Metrics Sliders (All 8 Criteria) -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Step 2: Rubric (0-10)</h3>
                        
                        <div id="slider-container" class="space-y-6">
                            <!-- JS will inject sliders here for cleaner code, or define them manually -->
                        </div>
                    </div>

                    <!-- 3. Feedback -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Step 3: Narrative</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Key Strengths</label>
                                <textarea id="strengths" class="py-3 px-4 block w-full border border-gray-200 rounded-lg text-sm outline-none focus:ring-indigo-500" rows="3"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Areas for Improvement</label>
                                <textarea id="improvements" class="py-3 px-4 block w-full border border-gray-200 rounded-lg text-sm outline-none focus:ring-indigo-500" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="lg:col-span-1">
                    <div class="sticky top-6 space-y-4">
                        <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-xl shadow-indigo-100">
                            <h4 class="text-xs font-bold uppercase tracking-widest text-indigo-200 mb-6">Evaluation Summary</h4>
                            
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm opacity-80">Calculated Avg</span>
                                <span id="display-avg" class="text-3xl font-black">0.00</span>
                            </div>
                            <div class="w-full bg-white/20 h-1.5 rounded-full mb-6">
                                <div id="progress-bar" class="bg-white h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>

                            <div class="space-y-3 mb-8">
                                <div class="flex justify-between text-xs border-b border-white/10 pb-2">
                                    <span class="opacity-80">Evaluator</span>
                                    <span id="eval-name" class="font-bold">...</span>
                                </div>
                                <div class="flex justify-between text-xs border-b border-white/10 pb-2">
                                    <span class="opacity-80">Date</span>
                                    <span id="eval-date" class="font-bold">...</span>
                                </div>
                            </div>

                            <button onclick="submitEvaluation()" type="button" class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-bold rounded-xl bg-white text-indigo-600 hover:bg-indigo-50 transition shadow-lg">
                                Submit Score
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token) window.location.href = 'auth.html';

        // 1. Setup the 8 criteria sliders
        const criteria = [
            { id: 's_style', label: 'Slide/Style' },
            { id: 's_content', label: 'Content' },
            { id: 's_clarity', label: 'Clarity' },
            { id: 's_timing', label: 'Timing' },
            { id: 's_wow', label: 'Wow Factor' },
            { id: 's_clear_res', label: 'Clear Response' },
            { id: 's_acc_res', label: 'Accurate Response' },
            { id: 's_con_res', label: 'Conciseness' }
        ];

        function initSliders() {
            const container = document.getElementById('slider-container');
            criteria.forEach(c => {
                container.innerHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-800">${c.label}</label>
                            <span id="val-${c.id}" class="text-xs font-bold py-1 px-2 bg-indigo-50 text-indigo-600 rounded">5.0</span>
                        </div>
                        <input type="range" id="${c.id}" min="0" max="10" step="0.5" value="5" 
                            class="metric-slider w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                            oninput="updateUI('${c.id}', this.value)">
                    </div>
                `;
            });
            calculateAvg();
        }

        function updateUI(id, val) {
            document.getElementById(`val-${id}`).innerText = parseFloat(val).toFixed(1);
            calculateAvg();
        }

        function calculateAvg() {
            let total = 0;
            criteria.forEach(c => {
                total += parseFloat(document.getElementById(c.id).value);
            });
            const avg = total / criteria.length;
            document.getElementById('display-avg').innerText = avg.toFixed(2);
            document.getElementById('progress-bar').style.width = (avg * 10) + '%';
        }

        // 2. Fetch Groups and Members
        async function loadData() {
            document.getElementById('eval-name').innerText = user.name;
            document.getElementById('eval-date').innerText = new Date().toLocaleDateString();

            try {
                // Get Groups
                const gRes = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const groups = await gRes.json();
                
                const groupSelect = document.getElementById('group-select');
                groupSelect.innerHTML = '<option value="">Select Group</option>';
                groups.forEach(g => {
                    groupSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
                });

                // Get All Users (Simple approach)
                const uRes = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await uRes.json();
                
                const memberSelect = document.getElementById('member-select');
                memberSelect.innerHTML = '<option value="">Select Member</option>';
                users.forEach(u => {
                    memberSelect.innerHTML += `<option value="${u.id}">${u.name}</option>`;
                });
            } catch (e) {
                console.error("Failed to load data", e);
            }
        }

        // 3. Submit to Vercel
        async function submitEvaluation() {
            const payload = {
                member_id: document.getElementById('member-select').value,
                group_id: document.getElementById('group-select').value,
                strengths: document.getElementById('strengths').value,
                improvements: document.getElementById('improvements').value
            };

            if(!payload.member_id || !payload.group_id) return alert("Please select a group and member");

            // Add all 8 scores to payload
            criteria.forEach(c => {
                payload[c.id] = document.getElementById(c.id).value;
            });

            try {
                const response = await fetch(`${API_URL}/evaluations`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Evaluation submitted successfully!");
                    window.location.href = 'dashboard.html';
                } else {
                    const err = await response.json();
                    alert("Error: " + err.error);
                }
            } catch (e) {
                alert("Submission failed. Check console.");
            }
        }

        initSliders();
        loadData();
    </script>
</body>
</html>
