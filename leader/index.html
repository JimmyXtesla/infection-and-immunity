<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leader Scoring | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-in { animation: slideIn 0.4s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-white-200 min-h-screen p-6 font-sans">
    <div class="max-w-2xl mx-auto">
        
        <!-- Top Navigation & Progress -->
        <div class="flex justify-between items-center mb-6 text-white/80">
            <div class="flex flex-col">
                <span class="text-xs font-bold uppercase tracking-widest text-green-200">Evaluation Mode</span>
                <span id="progress-text" class="text-sm font-medium text-white">Group 1 of 4</span>
            </div>
            <button onclick="location.href='../index.html'" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-xs transition">Save & Exit</button>
        </div>

        <!-- Progress Bar -->
        <div class="w-full h-1.5 bg-indigo-800 rounded-full mb-10 overflow-hidden">
            <div id="progress-bar" class="h-full bg-white transition-all duration-500" style="width: 25%"></div>
        </div>

        <!-- SCORING CARD -->
        <div id="scoring-container">
            <div id="group-card" class="bg-white rounded-[2.5rem] p-8 shadow-2xl shadow-indigo-900/40 slide-in">
                <!-- Group Identity -->
                <div class="mb-10 text-center">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-black">
                        <span id="group-initials">NI</span>
                    </div>
                    <h1 id="group-name" class="text-3xl font-black text-slate-900 leading-tight">Nexus Innovations</h1>
                    <p id="group-topic" class="text-slate-500 font-medium">Topic: AI in Healthcare</p>
                </div>

                <!-- Criteria Form -->
                <div class="space-y-8">
                    <!-- Score 1 -->
                    <div>
                        <div class="flex justify-between mb-3">
                            <label class="font-bold text-slate-700 text-sm">Design & Aesthetics</label>
                            <span id="val1" class="text-indigo-600 font-black">5</span>
                        </div>
                        <input type="range" min="1" max="10" value="5" id="input1" oninput="updateUIVal('val1', this.value)" 
                            class="w-full h-3 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>

                    <!-- Score 2 -->
                    <div>
                        <div class="flex justify-between mb-3">
                            <label class="font-bold text-slate-700 text-sm">Technical Implementation</label>
                            <span id="val2" class="text-indigo-600 font-black">5</span>
                        </div>
                        <input type="range" min="1" max="10" value="5" id="input2" oninput="updateUIVal('val2', this.value)" 
                            class="w-full h-3 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>

                    <!-- Feedback -->
                    <div class="bg-slate-50 p-6 rounded-3xl border-2 border-dashed border-slate-200">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Private Notes</label>
                        <textarea id="feedback" class="w-full bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-300 resize-none text-sm" rows="2" placeholder="What stood out to you?"></textarea>
                    </div>

                    <button onclick="handleNext()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-[2rem] shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-2 group">
                        <span id="submit-btn-text">Next Group</span>
                        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Success Screen (Hidden initially) -->
        <div id="success-screen" class="hidden text-center py-20 slide-in">
            <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h2 class="text-4xl font-black text-white mb-4">All Done!</h2>
            <p class="text-indigo-100 mb-10">You have successfully scored all groups for today.</p>
            <button onclick="location.href='../index.html'" class="bg-white text-indigo-600 font-bold px-10 py-4 rounded-2xl shadow-xl">Back to Home</button>
        </div>

    </div>

    <script src="../shared/js/data-store.js"></script>
    <script src="leader-logic.js"></script>
</body>
</html>
