<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Portal | Infection & Immunity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-gray-100 h-full flex items-center justify-center p-6 font-sans">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">Leader Portal</h1>
            <p class="text-sm font-medium text-gray-500 mt-2">Sign in to continue</p>
        </div>

        <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-200">
            <!-- Tabs -->
            <div class="flex bg-gray-50 p-1 rounded-xl mb-8 border border-gray-100">
                <button id="tab-login" onclick="setMode('login')"
                    class="flex-1 py-3 text-[11px] font-black uppercase tracking-widest rounded-lg bg-gray-900 text-white transition-all duration-300">Login</button>
                <button id="tab-register" onclick="setMode('register')"
                    class="flex-1 py-3 text-[11px] font-black uppercase tracking-widest rounded-lg text-gray-400 transition-all duration-300">Register</button>
            </div>

            <form id="auth-form" class="space-y-6">
                <div id="register-fields" class="hidden space-y-6">
                    <div class="space-y-1.5">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Full
                            Name</label>
                        <input type="text" id="name"
                            class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all placeholder:text-gray-300 font-medium"
                            placeholder="Dr. J. Smith">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label
                        class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all placeholder:text-gray-300 font-medium"
                        placeholder="name@research.edu">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center px-1">
                        <label
                            class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">Password</label>
                        <a href="#"
                            class="text-[10px] font-bold text-gray-900 uppercase tracking-widest hover:underline">Forgot?</a>
                    </div>
                    <input type="password" id="password" required
                        class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all placeholder:text-gray-400 font-mono"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-4 bg-gray-900 text-white font-black text-xs uppercase tracking-widest rounded-lg hover:bg-gray-800 transition-all active:scale-95 flex items-center justify-center gap-3">
                    Sign In
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Infection & Immunity
        </p>
    </div>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        let currentMode = 'login';

        function setMode(mode) {
            currentMode = mode;
            const regFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');

            if (mode === 'login') {
                regFields.classList.add('hidden');
                submitBtn.innerHTML = 'Sign In <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>';

                loginTab.classList.add('bg-gray-900', 'text-white');
                loginTab.classList.remove('text-gray-400');

                regTab.classList.remove('bg-gray-900', 'text-white');
                regTab.classList.add('text-gray-400');
            } else {
                regFields.classList.remove('hidden');
                submitBtn.innerHTML = 'Create Account <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>';

                regTab.classList.add('bg-gray-900', 'text-white');
                regTab.classList.remove('text-gray-400');

                loginTab.classList.remove('bg-gray-900', 'text-white');
                loginTab.classList.add('text-gray-400');
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';
            // Force role to LEADER for registration on this page
            const payload = currentMode === 'login' ? { email, password } : { name, email, password, role: 'LEADER' };

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    if (currentMode === 'register') {
                        alert("Leader Account Created. Please Login.");
                        setMode('login');
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userRole', data.user.role.toLowerCase());

                    if (data.user.role === 'LEADER') {
                        window.location.href = 'index.html';
                    } else if (data.user.role === 'ADMIN') {
                        // Admins can probably access leader views too, but let's warn or redirect
                        window.location.href = 'index.html';
                    } else {
                        // Regular members don't have a portal yet or share leader portal?
                        // Assuming members use this too for now, or maybe only leaders.
                        // The prompt asked specifically for Leader Login.
                        if (data.user.role === 'MEMBER') alert("Welcome Member. Redirecting...");
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(data.error || "Access Denied");
                }
            } catch (err) {
                alert("Connection Error");
            }
        });
    </script>
</body>

</html>
