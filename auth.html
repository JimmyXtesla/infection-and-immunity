<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials Access | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#f9fafb] h-full flex items-center justify-center p-6 font-sans">

    <div class="max-w-md w-full animate-fade">
        <div class="text-center mb-10">
            <div
                class="w-16 h-16 rounded-[1.5rem] flex items-center justify-center text-white font-black bg-[#00A78E] mx-auto mb-6 shadow-2xl shadow-[#00A78E]/20">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">Identity Terminal</h1>
            <p class="text-sm font-bold text-gray-400 mt-2">Identify yourself to access the clinical data cycle.</p>
        </div>

        <div class="dribbble-card bg-white p-10 shadow-2xl shadow-gray-200/50">
            <!-- Tabs -->
            <div class="flex bg-gray-50 p-1 rounded-xl mb-8 border border-gray-100">
                <button id="tab-login" onclick="setMode('login')"
                    class="flex-1 py-3 text-[11px] font-black uppercase tracking-widest rounded-lg bg-white text-[#00A78E] shadow-sm transition-all duration-300">Authorize</button>
                <button id="tab-register" onclick="setMode('register')"
                    class="flex-1 py-3 text-[11px] font-black uppercase tracking-widest rounded-lg text-gray-400 transition-all duration-300">Enrollment</button>
            </div>

            <form id="auth-form" class="space-y-6">
                <div id="register-fields" class="hidden space-y-6">
                    <div class="space-y-1.5">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Full
                            Personnel Name</label>
                        <input type="text" id="name"
                            class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all placeholder:text-gray-300 font-medium"
                            placeholder="John Doe">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Email
                        Terminal</label>
                    <input type="email" id="email" required
                        class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all placeholder:text-gray-300 font-medium"
                        placeholder="name@terminal.edu">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center px-1">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest">Bio-Key
                            Password</label>
                        <a href="#"
                            class="text-[10px] font-black text-[#00A78E] uppercase tracking-widest hover:underline">Revoke?</a>
                    </div>
                    <input type="password" id="password" required
                        class="w-full px-5 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all placeholder:text-gray-400 font-mono"
                        value="••••••••">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-4 bg-[#00A78E] text-white font-black text-xs uppercase tracking-widest rounded-lg shadow-xl shadow-[#00A78E]/20 hover:bg-[#008f7a] transition-all active:scale-95 flex items-center justify-center gap-3">
                    Authorize Access
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </form>
        </div>

        <p class="text-center mt-10 text-[10px] font-black text-gray-200 uppercase tracking-widest">Authorized Clinical
            Personnel Only</p>
    </div>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        let currentMode = 'login';

        function setMode(mode) {
            currentMode = mode;
            const regFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');

            if (mode === 'login') {
                regFields.classList.add('hidden');
                submitBtn.innerHTML = 'Authorize Access <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>';
                loginTab.classList.replace('text-gray-400', 'text-[#00A78E]');
                loginTab.classList.add('bg-white', 'shadow-sm');
                regTab.classList.replace('text-[#00A78E]', 'text-gray-400');
                regTab.classList.remove('bg-white', 'shadow-sm');
            } else {
                regFields.classList.remove('hidden');
                submitBtn.innerHTML = 'Enroll Identity <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>';
                regTab.classList.replace('text-gray-400', 'text-[#00A78E]');
                regTab.classList.add('bg-white', 'shadow-sm');
                loginTab.classList.replace('text-[#00A78E]', 'text-gray-400');
                loginTab.classList.remove('bg-white', 'shadow-sm');
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';
            const payload = currentMode === 'login' ? { email, password } : { name, email, password };

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userRole', data.user.role.toLowerCase());

                    if (currentMode === 'login') {
                        window.location.href = data.user.role === 'ADMIN' ? 'admin/' : 'leader/';
                    } else {
                        alert("Enrollment successful. Please authorize your identity.");
                        setMode('login');
                    }
                } else {
                    alert(data.error || "Access Denied");
                }
            } catch (err) {
                alert("Terminal connection error.");
            }
        });
    </script>
</body>

</html>
