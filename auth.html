<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Brand -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-indigo-600 tracking-tight">I and I</h1>
            <p class="text-green-500 mt-2 font-medium" id="auth-subtitle">Welcome back! Please enter your details.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200 overflow-hidden">
            <!-- Tab Switcher -->
            <div class="flex p-2 bg-slate-50 border-b border-slate-100">
                <button onclick="toggleAuth('login')" id="tab-login" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-white shadow-sm text-indigo-600">Login</button>
                <button onclick="toggleAuth('register')" id="tab-register" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-500 hover:text-slate-700">Leader Register</button>
            </div>

            <form id="auth-form" class="p-8 space-y-5">
                <!-- Name (Only for Register) -->
                <div id="name-container" class="hidden">
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" id="name" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300" placeholder="e.g. Alex Rivera">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300" placeholder="name@company.com">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300" placeholder="••••••••">
                </div>

                <!-- Error Message -->
                <div id="error-box" class="hidden p-3 rounded-xl bg-red-50 border border-red-100 text-red-600 text-xs font-bold"></div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-xl shadow-indigo-100 flex justify-center items-center gap-2">
                    <span>Sign In</span>
                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
                </button>
            </form>
        </div>
        
        <p class="text-center mt-8 text-sm text-slate-400 font-medium">
            System Status: <span class="text-green-500">API Online</span>
        </p>
    </div>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        
        let currentMode = 'login';

        function toggleAuth(mode) {
            currentMode = mode;
            const nameContainer = document.getElementById('name-container');
            const authSubtitle = document.getElementById('auth-subtitle');
            const submitBtnText = document.querySelector('#submit-btn span');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'register') {
                nameContainer.classList.remove('hidden');
                authSubtitle.innerText = "Create a Leader account to start scoring.";
                submitBtnText.innerText = "Create Account";
                tabRegister.className = "flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-white shadow-sm text-indigo-600";
                tabLogin.className = "flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-500";
            } else {
                nameContainer.classList.add('hidden');
                authSubtitle.innerText = "Welcome back! Please enter your details.";
                submitBtnText.innerText = "Sign In";
                tabLogin.className = "flex-1 py-2.5 text-sm font-bold rounded-xl transition-all bg-white shadow-sm text-indigo-600";
                tabRegister.className = "flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-500";
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('submit-btn');
            
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            if (currentMode === 'register') {
                payload.name = document.getElementById('name').value;
                payload.role = 'LEADER'; 
            }

            const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';

            try {
                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || "Authentication failed");

                if (currentMode === 'login') {
                    // SUCCESSFUL LOGIN
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to Dashboard
                    window.location.href = '/leader';
                } else {
                    // SUCCESSFUL REGISTRATION
                    alert("Account created! Now please log in.");
                    toggleAuth('login');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70');
                }

            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/leader';
        }
    </script>
</body>
</html>
