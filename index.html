<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreFlow | Authorized Personnel Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#f9fafb] h-full flex items-center justify-center p-6 font-sans">

    <div class="max-w-4xl w-full grid md:grid-cols-2 gap-10 animate-fade">
        <!-- Brand Info -->
        <div class="flex flex-col justify-center text-center md:text-left">
            <div class="flex items-center justify-center md:justify-start gap-4 mb-8">
                <div
                    class="w-16 h-16 rounded-[1.5rem] flex items-center justify-center text-white font-black bg-[#00A78E] shadow-2xl shadow-[#00A78E]/20">
                    <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-4xl font-black text-gray-900 tracking-tighter">ScoreFlow</h1>
                    <p class="text-[10px] font-black text-[#00A78E] uppercase tracking-[0.2em] mt-1">Personnel
                        Management System</p>
                </div>
            </div>
            <h2 class="text-5xl font-black text-gray-900 tracking-tighter leading-tight mb-6">
                Performance <br><span class="text-[#00A78E]">Visualization.</span>
            </h2>
            <p class="text-gray-400 font-medium text-lg max-w-sm mb-10 leading-relaxed">
                Connect your presentation cohorts and track performance trends with our state-of-the-art
                evaluation metrics.
            </p>
            <div class="flex items-center gap-6 justify-center md:justify-start">
                <div class="flex -space-x-3">
                    <img src="https://i.pravatar.cc/100?u=1"
                        class="w-10 h-10 rounded-full border-4 border-white shadow-sm" alt="">
                    <img src="https://i.pravatar.cc/100?u=2"
                        class="w-10 h-10 rounded-full border-4 border-white shadow-sm" alt="">
                    <img src="https://i.pravatar.cc/100?u=3"
                        class="w-10 h-10 rounded-full border-4 border-white shadow-sm" alt="">
                </div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest" id="lp-member-count">
                    CONNECTING TO DATABASE...</p>
            </div>
        </div>

        <!-- Portal Choice -->
        <div
            class="dribbble-card p-10 lg:p-14 bg-white flex flex-col justify-center gap-8 shadow-2xl shadow-gray-200/50">
            <div>
                <h3 class="text-2xl font-black text-gray-900 tracking-tight">Access Portal</h3>
                <p class="text-sm font-bold text-gray-400 mt-1">Select your access level to proceed.</p>
            </div>

            <div class="space-y-4">
                <button onclick="auth('leader')"
                    class="group w-full p-8 rounded-[2rem] border border-gray-100 hover:border-[#00A78E] hover:bg-[#e6f6f4] transition-all duration-500 flex items-center justify-between text-left">
                    <div class="flex items-center gap-6">
                        <div
                            class="w-14 h-14 rounded-2xl bg-gray-50 group-hover:bg-[#00A78E] group-hover:text-white flex items-center justify-center text-gray-400 transition-all duration-500">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-lg font-black text-gray-900 group-hover:text-[#00A78E] transition-colors">
                                Group Leader</p>
                            <p class="text-xs font-bold text-gray-400">Authorized scoring & evaluation.</p>
                        </div>
                    </div>
                    <svg class="w-6 h-6 text-gray-200 group-hover:text-[#00A78E] group-hover:translate-x-1 transition-all"
                        fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>

                <button onclick="auth('admin')"
                    class="group w-full p-8 rounded-[2rem] border border-gray-100 hover:border-[#ef4444] hover:bg-rose-50 transition-all duration-500 flex items-center justify-between text-left">
                    <div class="flex items-center gap-6">
                        <div
                            class="w-14 h-14 rounded-2xl bg-gray-50 group-hover:bg-rose-500 group-hover:text-white flex items-center justify-center text-gray-400 transition-all duration-500">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path
                                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-lg font-black text-gray-900 group-hover:text-rose-600 transition-colors">
                                Administrator</p>
                            <p class="text-xs font-bold text-gray-400">Control center.</p>
                        </div>
                    </div>
                    <svg class="w-6 h-6 text-gray-200 group-hover:text-rose-600 group-hover:translate-x-1 transition-all"
                        fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </div>

            <p class="text-center text-[10px] font-black text-gray-300 uppercase tracking-widest">ScoreFlow Performance
                Monitoring</p>
        </div>
    </div>

    <script>
        function auth(role) {
            localStorage.setItem('userRole', role);
            window.location.href = 'auth.html';
        }

        // Fetch Stats for Landing Page
        async function fetchLandingStats() {
            try {
                const res = await fetch("https://scorer-api.vercel.app/api/users"); // Public endpoint or require generic token?
                // The API requires a token usually. But for a landing page, we might not have one.
                // However, I can check if I have a token in local storage or use a public stats endpoint if available.
                // Looking at server.js, /api/users requires authenticateToken.
                // /api/dashboard/stats also requires token.
                // If no token, I can't fetch. 
                // But the user didn't ask to implement public endpoints.
                // I will try to use the token if available, otherwise show "Authorized Access Only" or generic text.
                // Actually, I should probably leave it as static if I can't fetch it without login.
                // BUT the user said "remove any hardcoded value".
                // I will add a check.

                const token = localStorage.getItem('token');
                if (token) {
                    const res = await fetch("https://scorer-api.vercel.app/api/dashboard/stats", {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        // The dashboard stats returns totalGroups, globalAverage.
                        // It does NOT return total users count.
                        // /api/users returns the list.
                        const uRes = await fetch("https://scorer-api.vercel.app/api/users", {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const users = await uRes.json();
                        document.getElementById('lp-member-count').innerText = `+${users.length} REGISTERED MEMBERS`;
                    } else {
                        document.getElementById('lp-member-count').innerText = "SECURE CLINICAL PORTAL";
                    }
                } else {
                    document.getElementById('lp-member-count').innerText = "AUTHORIZED PERSONNEL ONLY";
                }
            } catch (e) {
                document.getElementById('lp-member-count').innerText = "SYSTEM OFFLINE";
            }
        }

        fetchLandingStats();
    </script>
</body>

</html>
