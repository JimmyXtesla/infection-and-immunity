<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreFlow | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8">
        <div class="text-center mb-10">
            </div>
            <h1 class=" text-green text-3xl font-bold ">Infection and Immunity</h1>
            <p class="text-slate-500 mt-2">Choose your portal to continue</p>
        </div>

        <div class="grid gap-4">
            <button onclick="auth('leader')" class="group flex items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl hover:border-green-500 hover:shadow-md transition-all duration-300">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-slate-50 rounded-xl group-hover:bg-blue-50 transition-colors">
                        <svg class="w-6 h-6 text-slate-600 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </div>
                    <div class="text-left">
                        <p class="font-semibold">Group Leader</p>
                        <p class="text-xs text-slate-400">Score other presentations</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-slate-300 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>

            <button onclick="auth('admin')" class="group flex items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl hover:border-slate-800 hover:shadow-md transition-all duration-300">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-slate-50 rounded-xl group-hover:bg-slate-100 transition-colors">
                        <svg class="w-6 h-6 text-slate-600 group-hover:text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    </div>
                    <div class="text-left">
                        <p class="font-semibold">Administrator</p>
                        <p class="text-xs text-slate-400">Manage schedules & analytics</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-slate-300 group-hover:text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>
    <script>
        function auth(role) {
            localStorage.setItem('userRole', role);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
