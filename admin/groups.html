<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Groups | I and I ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Sidebar & Mobile Header (Omitted for brevity, use same as dashboard.html) -->
    <!-- ... [Include Sidebar Code Here] ... -->

    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Groups & Teams</h1>
                    <p class="text-slate-500">Organize members into cohorts for scoring.</p>
                </div>
                <button type="button" data-hs-overlay="#hs-add-group-modal" class="py-2 px-4 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-lg hover:bg-indigo-700 transition">
                    + New Group
                </button>
            </header>

            <!-- Status Indicator -->
            <div id="status-msg" class="hidden mb-4 p-3 rounded-lg text-xs font-bold text-center"></div>

            <div id="group-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Group cards injected here -->
                <div class="animate-pulse bg-white border rounded-2xl h-40"></div>
                <div class="animate-pulse bg-white border rounded-2xl h-40"></div>
            </div>
        </div>
    </main>

    <!-- Side Drawer: Assign Members -->
    <div id="hs-manage-members-drawer" class="hs-overlay hs-overlay-open:translate-x-0 translate-x-full fixed top-0 end-0 transition-all duration-300 transform h-full max-w-xs w-full z-[80] bg-white border-s hidden" tabindex="-1">
        <div class="flex flex-col h-full">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h3 class="font-bold text-slate-800">Assign Members</h3>
                    <p class="text-[10px] text-indigo-600 font-bold uppercase" id="active-group-name">Group Name</p>
                </div>
                <button type="button" class="text-slate-500" data-hs-overlay="#hs-manage-members-drawer">✕</button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto">
                <input type="text" id="drawer-search" onkeyup="filterDrawerUsers()" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Search users...">
                <div id="drawer-user-list" class="space-y-2">
                    <!-- Users loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Group -->
    <div id="hs-add-group-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-white border shadow-sm rounded-2xl pointer-events-auto">
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">Create New Group</h3>
                    <button type="button" class="text-gray-400" data-hs-overlay="#hs-add-group-modal">✕</button>
                </div>
                <form id="add-group-form" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Group Name</label>
                        <input type="text" id="g-name" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Description</label>
                        <textarea id="g-desc" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" rows="3"></textarea>
                    </div>
                    <button type="submit" id="create-btn" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition">Create Group</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; /
        const token = localStorage.getItem('token');
        
        let activeGroupId = null;
        let allUsers = [];

        if (!token) window.location.href = 'login.html';

        // 1. Fetch Groups from API
        async function fetchGroups() {
            try {
                const res = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const groups = await res.json();
                renderGroups(groups);
            } catch (err) {
                showStatus("Error connecting to database", "bg-red-100 text-red-600");
            }
        }

        function renderGroups(groups) {
            const grid = document.getElementById('group-grid');
            grid.innerHTML = '';
            
            if (groups.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">No groups found. Click "New Group" to begin.</p>';
                return;
            }

            groups.forEach(g => {
                grid.innerHTML += `
                    <div class="bg-white border rounded-2xl p-6 shadow-sm flex flex-col transition hover:shadow-md">
                        <div class="flex justify-between items-start mb-4">
                            <div class="size-10 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold">
                                ${g.name.charAt(0)}
                            </div>
                            <span class="text-[10px] font-bold text-slate-300">ID: ${g.id}</span>
                        </div>
                        <h3 class="text-lg font-black text-slate-800">${g.name}</h3>
                        <p class="text-sm text-slate-500 mt-1 mb-6 flex-grow">${g.description || 'No description provided.'}</p>
                        
                        <button onclick="openMemberManager(${g.id}, '${g.name}')" 
                                data-hs-overlay="#hs-manage-members-drawer" 
                                class="w-full py-2.5 bg-slate-50 text-indigo-600 font-bold rounded-xl text-xs hover:bg-indigo-50 transition border border-indigo-100">
                            Manage Members
                        </button>
                    </div>
                `;
            });
        }

        // 2. Create Group Logic
        document.getElementById('add-group-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('create-btn');
            const payload = {
                name: document.getElementById('g-name').value,
                description: document.getElementById('g-desc').value
            };

            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                const res = await fetch(`${API_URL}/groups`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    HSOverlay.close('#hs-add-group-modal');
                    document.getElementById('add-group-form').reset();
                    showStatus("Group created successfully!", "bg-green-100 text-green-600");
                    fetchGroups();
                } else {
                    alert("Failed to create group.");
                }
            } catch (err) {
                alert("Network error.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Create Group";
            }
        });

        // 3. Member Management (Drawer)
        async function openMemberManager(id, name) {
            activeGroupId = id;
            document.getElementById('active-group-name').innerText = name;
            
            const list = document.getElementById('drawer-user-list');
            list.innerHTML = '<div class="animate-pulse space-y-2"><div class="h-10 bg-slate-100 rounded"></div><div class="h-10 bg-slate-100 rounded"></div></div>';

            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allUsers = await res.json();
                renderDrawerUsers(allUsers);
            } catch (err) {
                list.innerHTML = '<p class="text-red-500 text-xs">Error loading users.</p>';
            }
        }

        function renderDrawerUsers(users) {
            const list = document.getElementById('drawer-user-list');
            list.innerHTML = '';
            
            users.forEach(u => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 border rounded-xl hover:bg-slate-50 transition">
                        <div>
                            <p class="text-sm font-bold text-slate-800">${u.name}</p>
                            <p class="text-[10px] text-slate-500">${u.role}</p>
                        </div>
                        <button onclick="addUserToGroup(${u.id}, this)" class="size-8 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-600 hover:text-white transition">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>
                        </button>
                    </div>
                `;
            });
        }

        async function addUserToGroup(userId, btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin size-3 border-2 border-indigo-600 border-t-transparent rounded-full"></span>';

            try {
                const res = await fetch(`${API_URL}/groups/members`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ group_id: activeGroupId, user_id: userId })
                });

                if (res.ok) {
                    btn.className = "size-8 flex items-center justify-center bg-green-500 text-white rounded-lg";
                    btn.innerHTML = '✓';
                } else {
                    const data = await res.json();
                    alert(data.error || "User already in group");
                    btn.disabled = false;
                    btn.innerHTML = '+';
                }
            } catch (err) {
                alert("Connection failed.");
                btn.disabled = false;
            }
        }

        function filterDrawerUsers() {
            const query = document.getElementById('drawer-search').value.toLowerCase();
            const filtered = allUsers.filter(u => u.name.toLowerCase().includes(query));
            renderDrawerUsers(filtered);
        }

        function showStatus(msg, classes) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.className = `p-3 rounded-lg text-xs font-bold text-center ${classes}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Initial Load
        fetchGroups();
    </script>
</body>
</html>
