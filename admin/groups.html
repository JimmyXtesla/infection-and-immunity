<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Groups | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Sidebar & Mobile Header (Same as Users Page) -->
    <!-- ... [Sidebar HTML Code] ... -->

    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Groups & Teams</h1>
                    <p class="text-slate-500">Organize members into cohorts.</p>
                </div>
                <button data-hs-overlay="#hs-add-group-modal" class="py-2 px-4 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-lg hover:bg-indigo-700 transition">
                    + New Group
                </button>
            </header>

            <div id="group-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Group cards injected here -->
            </div>
        </div>
    </main>

    <!-- Side Drawer: Manage Members -->
    <div id="hs-manage-members-drawer" class="hs-overlay hs-overlay-open:translate-x-0 translate-x-full fixed top-0 end-0 transition-all duration-300 transform h-full max-w-xs w-full z-[80] bg-white border-s hidden" tabindex="-1">
        <div class="flex flex-col h-full">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Add to Group</h3>
                <button type="button" class="text-slate-500" data-hs-overlay="#hs-manage-members-drawer">✕</button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto">
                <p class="text-xs text-slate-500">Select a member to add to the active group.</p>
                <div id="drawer-user-list" class="space-y-2">
                    <!-- Users loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Group -->
    <div id="hs-add-group-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-white border shadow-sm rounded-2xl pointer-events-auto">
                <div class="p-4 border-b font-bold">Create Group</div>
                <form id="add-group-form" class="p-6 space-y-4">
                    <input type="text" id="g-name" placeholder="Group Name (e.g. Cohort Alpha)" required class="w-full p-3 border rounded-xl outline-none">
                    <textarea id="g-desc" placeholder="Description..." class="w-full p-3 border rounded-xl outline-none" rows="3"></textarea>
                    <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">Create Group</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        let activeGroupId = null;

        async function fetchGroups() {
            const res = await fetch(`${API_URL}/groups`, { headers: { 'Authorization': `Bearer ${token}` } });
            const groups = await res.json();
            const grid = document.getElementById('group-grid');
            grid.innerHTML = '';
            groups.forEach(g => {
                grid.innerHTML += `
                    <div class="bg-white border rounded-2xl p-6 shadow-sm">
                        <h3 class="text-lg font-black text-slate-800">${g.name}</h3>
                        <p class="text-sm text-slate-500 mt-1 mb-6">${g.description || 'No description'}</p>
                        <button onclick="openMemberManager(${g.id})" data-hs-overlay="#hs-manage-members-drawer" class="w-full py-2 bg-slate-100 text-indigo-600 font-bold rounded-lg text-xs">Assign Members</button>
                    </div>
                `;
            });
        }

        async function openMemberManager(id) {
            activeGroupId = id;
            const res = await fetch(`${API_URL}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const users = await res.json();
            const list = document.getElementById('drawer-user-list');
            list.innerHTML = '';
            users.forEach(u => {
                list.innerHTML += `
                    <button onclick="addUserToGroup(${u.id})" class="w-full text-left p-3 hover:bg-indigo-50 border rounded-xl text-sm font-medium transition flex justify-between items-center">
                        ${u.name} <span class="text-indigo-600">+</span>
                    </button>
                `;
            });
        }

        async function addUserToGroup(userId) {
            const res = await fetch(`${API_URL}/groups/members`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ group_id: activeGroupId, user_id: userId })
            });
            if (res.ok) alert("Added successfully!");
        }

        document.getElementById('add-group-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = { name: document.getElementById('g-name').value, description: document.getElementById('g-desc').value };
            await fetch(`${API_URL}/groups`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            location.reload();
        });

        fetchGroups();
    </script>
</body>
</html>
