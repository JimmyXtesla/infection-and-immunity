<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Cohorts | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-[#f9fafb] min-h-full font-sans">

    <div id="top-header-pill"></div>
    <div id="mobile-header-container"></div>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-6 md:p-8 lg:p-10 max-w-[1600px] mx-auto animate-fade">

            <!-- Breadcrumbs & Actions -->
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8">
                <nav class="flex items-center gap-2 text-sm font-medium">
                    <span class="text-gray-400">Records</span>
                    <span class="text-gray-400">/</span>
                    <span class="text-[#00A78E]">Groups</span>
                </nav>
                <div class="flex items-center gap-3 mt-4 md:mt-0">
                    <button class="btn-outline flex items-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Import Schema
                    </button>
                    <button data-hs-overlay="#hs-add-group-modal" class="btn-teal flex items-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        Create Cohort
                    </button>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="flex items-center gap-8 mb-8 border-b border-gray-100 overflow-x-auto pb-px">
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-[#00A78E] text-[#00A78E] text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    All Cohorts
                </button>
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    Active Cycles
                </button>
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    Archive
                </button>
            </div>

            <!-- Groups Grid -->
            <div id="groups-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Skeletons -->
                <div class="dribbble-card p-10 h-72 flex flex-col justify-between animate-pulse">
                    <div class="w-16 h-16 bg-gray-100 rounded-2xl"></div>
                    <div class="space-y-4">
                        <div class="w-32 h-6 bg-gray-100 rounded-lg"></div>
                        <div class="w-full h-3 bg-gray-50 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Add Group -->
    <div id="hs-add-group-modal"
        class="hs-overlay hidden w-full h-full fixed top-0 left-0 z-[60] overflow-x-hidden overflow-y-auto bg-black/5 backdrop-blur-sm">
        <div
            class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-3.5rem)] flex items-center justify-center">
            <div
                class="bg-[rgba(255,255,255,0.95)] backdrop-blur-xl border border-white/20 flex flex-col shadow-2xl rounded-2xl w-full">
                <div class="flex justify-between items-center py-5 px-8 border-b border-gray-100">
                    <h3 class="font-black text-gray-800 text-lg tracking-tight">
                        Create New Cohort
                    </h3>
                    <button type="button"
                        class="hs-dropdown-toggle inline-flex flex-shrink-0 justify-center items-center h-8 w-8 rounded-lg text-gray-500 hover:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 focus:ring-offset-white transition-all text-sm"
                        data-hs-overlay="#hs-add-group-modal">
                        <span class="sr-only">Close</span>
                        <svg class="w-3.5 h-3.5" width="8" height="8" viewBox="0 0 8 8" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M0.258206 1.00652C0.351976 0.912791 0.479126 0.860131 0.611706 0.860131C0.744296 0.860131 0.871447 0.912791 0.965207 1.00652L3.61171 3.65302L6.25822 1.00652C6.30432 0.958771 6.35952 0.920671 6.42052 0.894471C6.48152 0.868271 6.54712 0.854471 6.61352 0.853901C6.67992 0.853321 6.74572 0.865971 6.80722 0.891111C6.86862 0.916251 6.92442 0.953381 6.97142 1.00032C7.01832 1.04727 7.05552 1.1031 7.08062 1.16454C7.10572 1.22599 7.11842 1.29183 7.11782 1.35822C7.11722 1.42461 7.10342 1.49022 7.07722 1.55122C7.05102 1.61222 7.01292 1.6674 6.96522 1.71352L4.31871 4.36002L6.96522 7.00648C7.05632 7.10009 7.10662 7.22569 7.10512 7.35639C7.10362 7.48709 7.05042 7.61169 6.95722 7.70279C6.86392 7.79389 6.73822 7.84369 6.60752 7.84369C6.47682 7.84369 6.35112 7.79389 6.25792 7.70279L3.61171 5.05602L0.965207 7.70279C0.871907 7.79389 0.746207 7.84369 0.615506 7.84369C0.484806 7.84369 0.359106 7.79389 0.265906 7.70279C0.172706 7.61169 0.119506 7.48709 0.118006 7.35639C0.116506 7.22569 0.166806 7.10009 0.257906 7.00648L2.90471 4.36002L0.257906 1.71352C0.164306 1.61967 0.111706 1.49252 0.111706 1.36002C0.111706 1.22752 0.164306 1.10037 0.257906 1.00652H0.258206Z"
                                fill="currentColor" opacity="0.8" />
                        </svg>
                    </button>
                </div>
                <div class="p-8 overflow-y-auto">
                    <form id="add-group-form" class="space-y-5">
                        <!-- Group Name -->
                        <div>
                            <label for="g-name"
                                class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Cohort
                                Name</label>
                            <input type="text" id="g-name" placeholder="e.g. Infection Cohort A"
                                class="bg-gray-50 border border-gray-100 text-gray-900 text-sm rounded-xl focus:ring-[#00A78E] focus:border-[#00A78E] block w-full p-3 font-bold outline-none transition-all"
                                required>
                        </div>

                        <!-- Description -->
                        <div>
                            <label for="g-desc"
                                class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Description
                                / Context</label>
                            <textarea id="g-desc" rows="3" placeholder="Brief description of this presentation group..."
                                class="bg-gray-50 border border-gray-100 text-gray-900 text-sm rounded-xl focus:ring-[#00A78E] focus:border-[#00A78E] block w-full p-3 font-bold outline-none transition-all"></textarea>
                        </div>
                    </form>
                </div>
                <div class="flex justify-end items-center gap-x-2 py-5 px-8 border-t border-gray-100">
                    <button type="button"
                        class="py-2.5 px-4 inline-flex justify-center items-center gap-2 rounded-xl border border-transparent font-bold text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-0 transition-all text-xs uppercase tracking-widest"
                        data-hs-overlay="#hs-add-group-modal">
                        Cancel
                    </button>
                    <button type="submit" form="add-group-form"
                        class="py-2.5 px-6 inline-flex justify-center items-center gap-2 rounded-xl border border-transparent font-black bg-[#00A78E] text-white hover:bg-[#008f7a] focus:outline-none focus:ring-2 focus:ring-[#00A78E] focus:ring-offset-2 transition-all text-sm shadow-lg shadow-[#00A78E]/30">
                        Create Cohort
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '../auth.html';

        async function loadGroups() {
            try {
                const res = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const groups = Array.isArray(data) ? data : (data.groups || data.data || []);
                const grid = document.getElementById('groups-grid');
                grid.innerHTML = '';

                if (groups.length === 0) {
                    grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-400 font-bold italic">No research cohorts identified.</div>';
                    return;
                }

                groups.forEach((g, index) => {
                    const delay = index * 0.1;
                    const gName = g.name || g.group_name || 'Presentation Cohort';
                    const gDesc = g.description || `Monday I&I Session: Current cohort active in the weekly presentation rotation.`;

                    grid.innerHTML += `
                        <div class="dribbble-card p-8 group hover:border-[#00A78E] transition-all duration-500">
                            <div class="mb-8">
                                <div class="w-12 h-12 rounded-[1.25rem] bg-gray-50 flex items-center justify-center text-[#00A78E] mb-6 group-hover:bg-[#00A78E] group-hover:text-white transition-all duration-500">
                                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                </div>
                                <h3 class="text-xl font-black text-gray-900 mb-2 tracking-tight">${gName}</h3>
                                <p class="text-xs font-bold text-gray-400 leading-relaxed min-h-[40px] line-clamp-2">${gDesc}</p>
                            </div>
                            
                            <div class="pt-6 border-t border-gray-50 flex items-center justify-between">
                                <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                    REF ID: 00${g.id}
                                </div>
                                <a href="gmanage.html?id=${g.id}" class="h-10 px-4 flex items-center gap-2 bg-[#f3f4f6] text-gray-700 group-hover:bg-[#00A78E] group-hover:text-white rounded-lg text-[10px] font-black uppercase tracking-widest transition-all duration-300">
                                    Manage
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
                                </a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { console.error(err); }
        }
        loadGroups();

        // Add Group Logic
        document.getElementById('add-group-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('g-name').value;
            const desc = document.getElementById('g-desc').value;

            try {
                const res = await fetch(`${API_URL}/groups`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ name, description: desc })
                });

                if (res.ok) {
                    HSOverlay.close('#hs-add-group-modal');
                    document.getElementById('add-group-form').reset();
                    loadGroups();
                } else {
                    alert("Failed to create group");
                }
            } catch (e) { console.error(e); }
        });
    </script>
</body>

</html>
