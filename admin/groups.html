<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups | I and I ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Sidebar (Same as Dashboard) -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full max-h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="users.html">Users</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg" href="groups.html">Groups</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="score.html">Scoring Mode</a></li>
                </ul>
            </nav>
            <footer class="mt-auto p-4 border-t border-gray-200">
                <a href="group-manage.html" class="block w-full py-2 px-3 text-center bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700">Manage Members</a>
            </footer>
        </div>
    </div>

    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-y-4 mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Groups</h1>
                    <p class="text-slate-500">Overview of all active cohorts and teams.</p>
                </div>
            </header>

            <div id="groups-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data injected via JS -->
                <p class="text-slate-400 animate-pulse">Fetching groups...</p>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadGroups() {
            try {
                const res = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const groups = await res.json();
                const grid = document.getElementById('groups-grid');
                grid.innerHTML = '';

                groups.forEach(g => {
                    grid.innerHTML += `
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition">
                            <div class="size-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl mb-4">${g.name.charAt(0)}</div>
                            <h3 class="text-lg font-bold text-slate-800">${g.name}</h3>
                            <p class="text-sm text-slate-500 mt-1 mb-4">${g.description || 'No description'}</p>
                            <div class="pt-4 border-t flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-400 uppercase">ID: ${g.id}</span>
                                <a href="group-manage.html" class="text-xs font-bold text-indigo-600 hover:underline">Manage</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { console.error(err); }
        }
        loadGroups();
    </script>
</body>
</html>
