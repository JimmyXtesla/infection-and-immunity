<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | I and I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Mobile Header -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 py-2 lg:hidden">
        <div class="flex justify-between items-center">
            <a class="font-bold text-xl text-indigo-600" href="#">I and I</a>
            <button type="button" class="p-2 border rounded-lg" data-hs-overlay="#hs-sidebar-footer">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5 text-sm">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg" href="users.html">Users</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">Groups</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="score.html">Scoring Mode</a></li>
                </ul>
            </nav>
            <footer class="mt-auto p-4 border-t border-gray-200">
                <button onclick="logout()" class="flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm text-red-600 hover:bg-gray-100 w-full font-bold">Logout</button>
            </footer>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-y-4 mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">User Management</h1>
                    <p class="text-slate-500">View and manage all members in your system.</p>
                </div>
                <!-- 1. ADDED: data-hs-overlay attribute to open the modal -->
                <button data-hs-overlay="#hs-add-user-modal" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Add New User
                </button>
            </header>

            <!-- Filters -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mb-6">
                <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="relative">
                        <input type="text" id="user-search" onkeyup="filterUsers()" class="py-2 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Search by name or email...">
                        <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none ps-4">
                            <svg class="size-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-3 text-start text-xs font-bold text-slate-500 uppercase tracking-wider">User</th>
                                <th class="px-6 py-3 text-start text-xs font-bold text-slate-500 uppercase tracking-wider">Role</th>
                                <th class="px-6 py-3 text-start text-xs font-bold text-slate-500 uppercase tracking-wider">Joined</th>
                                <th class="px-6 py-3 text-end text-xs font-bold text-slate-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="divide-y divide-slate-200">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- 2. ADDED: Add User Modal -->
    <div id="hs-add-user-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto pointer-events-none">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-white border shadow-sm rounded-xl pointer-events-auto">
                <div class="flex justify-between items-center py-3 px-4 border-b">
                    <h3 class="font-bold text-gray-800">Add New User</h3>
                    <button type="button" class="flex justify-center items-center size-7 text-sm font-semibold rounded-full border border-transparent text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none" data-hs-overlay="#hs-add-user-modal">
                        <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                
                <form id="add-user-form" class="p-4 overflow-y-auto">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Full Name</label>
                            <input type="text" id="new-name" required class="py-2.5 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Jane Doe">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email Address</label>
                            <input type="email" id="new-email" required class="py-2.5 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="jane@example.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Assign Role</label>
                            <select id="new-role" class="py-2.5 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="MEMBER">Member (Gets Scored)</option>
                                <option value="LEADER">Leader (Can Score Others)</option>
                                <option value="ADMIN">Admin (Full Access)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Temporary Password</label>
                            <input type="password" id="new-password" required class="py-2.5 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="mt-6 flex justify-end gap-x-2">
                        <button type="button" class="py-2 px-3 inline-flex items-center text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50" data-hs-overlay="#hs-add-user-modal">Cancel</button>
                        <button type="submit" id="add-user-btn" class="py-2 px-4 inline-flex items-center text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Add User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Preline JS -->
    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>

    <!-- Logic JS -->
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        let allUsers = [];

        if (!token) window.location.href = 'login.html';

        // Fetch Users (Same as before)
        async function fetchUsers() {
            try {
                const response = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error("Failed to fetch");
                allUsers = await response.json();
                renderTable(allUsers);
            } catch (err) {
                document.getElementById('user-table-body').innerHTML = `<tr><td colspan="4" class="px-6 py-10 text-center text-red-500 font-bold">Error loading users.</td></tr>`;
            }
        }

        // Render Table (Same as before)
        function renderTable(users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            users.forEach(u => {
                const date = new Date(u.created_at).toLocaleDateString();
                const roleClass = u.role === 'ADMIN' ? 'bg-purple-100 text-purple-800' : (u.role === 'LEADER' ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-800');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center gap-x-3">
                                <div class="size-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs">${u.name.charAt(0).toUpperCase()}</div>
                                <div>
                                    <span class="block text-sm font-semibold text-slate-800">${u.name}</span>
                                    <span class="block text-xs text-slate-500">${u.email}</span>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="py-1 px-2.5 inline-flex items-center text-[10px] font-bold uppercase rounded-full ${roleClass}">${u.role}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                            <a href="profile.html?id=${u.id}" class="text-indigo-600 hover:text-indigo-900">View Performance</a>
                        </td>
                    </tr>
                `;
            });
        }

        function filterUsers() {
            const query = document.getElementById('user-search').value.toLowerCase();
            const filtered = allUsers.filter(u => u.name.toLowerCase().includes(query) || u.email.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // 3. ADDED: Form Submit Logic for adding a user
        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('add-user-btn');
            submitBtn.innerText = 'Creating...';
            submitBtn.disabled = true;

            const payload = {
                name: document.getElementById('new-name').value,
                email: document.getElementById('new-email').value,
                role: document.getElementById('new-role').value,
                password: document.getElementById('new-password').value
            };

            try {
                // We use the Registration endpoint, but pass the token so the server knows an Admin is doing it.
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Close the modal (Preline JS handles this)
                    HSOverlay.close(document.querySelector('#hs-add-user-modal'));
                    
                    // Clear the form
                    document.getElementById('add-user-form').reset();
                    
                    // Reload the table so the new user appears instantly
                    fetchUsers(); 
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Something went wrong");
            } finally {
                submitBtn.innerText = 'Add User';
                submitBtn.disabled = false;
            }
        });

        // Initial Load
        fetchUsers();
    </script>

    <!-- Add User Modal -->
<div id="hs-add-user-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto pointer-events-none">
  <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-3.5rem)] flex items-center">
    <div class="flex flex-col bg-white border shadow-sm rounded-xl pointer-events-auto w-full">
      <div class="flex justify-between items-center py-3 px-4 border-b">
        <h3 class="font-bold text-gray-800">Add New User</h3>
        <button type="button" class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200" data-hs-overlay="#hs-add-user-modal">
          <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="add-user-form" class="p-4 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">Full Name</label>
          <input type="text" id="new-name" required class="py-2 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Email Address</label>
          <input type="email" id="new-email" required class="py-2 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input type="password" id="new-password" required class="py-2 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Role</label>
          <select id="new-role" class="py-2 px-3 block w-full border border-gray-200 rounded-lg text-sm focus:ring-indigo-500">
            <option value="MEMBER">Member</option>
            <option value="LEADER">Leader</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit" class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-indigo-600 text-white hover:bg-indigo-700">
          Create User
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
