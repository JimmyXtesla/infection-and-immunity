<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | ScoreFlow Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen">
    <!-- Sidebar (Same as above) -->
    <!-- ... -->

    <main class="flex-1 p-6 md:p-12">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-slate-900">User Management</h1>
            <button onclick="document.getElementById('user-modal').classList.remove('hidden')" class="bg-green-600 text-white px-6 py-3 rounded-2x font-bold shadow-lg shadow-indigo-100">+ Add User</button>
        </div>

        <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr class="text-[10px] font-bold text-slate-400 uppercase">
                        <th class="p-6">User</th>
                        <th class="p-6">Role</th>
                        <th class="p-6">Group</th>
                        <th class="p-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="divide-y divide-slate-50">
                    <!-- JS renders this -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal for adding user -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-2x p-10">
            <h3 class="text-2xl font-bold mb-6">New User</h3>
            <input id="userName" type="text" placeholder="Name" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-indigo-600">
            <select id="userRole" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 outline-none">
                <option value="Leader">Group Leader</option>
                <option value="Member">Member</option>
            </select>
            <div class="flex gap-4">
                <button onclick="document.getElementById('user-modal').classList.add('hidden')" class="flex-1 py-4 font-bold text-slate-400">Cancel</button>
                <button onclick="addUser()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">Save</button>
            </div>
        </div>
    </div>

    <script src="../shared/js/data-store.js"></script>
    <script src="admin-core.js"></script>
</body>
</html>
