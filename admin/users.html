<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-[#f9fafb] min-h-full font-sans">

    <div id="top-header-pill"></div>
    <div id="mobile-header-container"></div>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-6 md:p-8 lg:p-10 max-w-[1600px] mx-auto animate-fade">

            <!-- Breadcrumbs & Actions -->
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8">
                <nav class="flex items-center gap-2 text-sm font-medium">
                    <span class="text-gray-400">List</span>
                    <span class="text-gray-400">/</span>
                    <span class="text-[#00A78E]">Users</span>
                </nav>
                <div class="flex items-center gap-3 mt-4 md:mt-0">
                    <div class="flex -space-x-2 mr-4">
                        <img src="https://i.pravatar.cc/100?u=1" class="w-8 h-8 rounded-full border-2 border-white"
                            alt="">
                        <img src="https://i.pravatar.cc/100?u=2" class="w-8 h-8 rounded-full border-2 border-white"
                            alt="">
                        <img src="https://i.pravatar.cc/100?u=3" class="w-8 h-8 rounded-full border-2 border-white"
                            alt="">
                        <div
                            class="w-8 h-8 rounded-full border-2 border-white bg-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-500 bg-[#e6f6f4] text-[#00A78E]">
                            +8</div>
                    </div>
                    <button class="btn-outline flex items-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path
                                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                        Share
                    </button>
                    <button data-hs-overlay="#hs-add-user-modal" class="btn-teal flex items-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        Create New
                    </button>
                </div>
            </div>

            <!-- Stats Rows -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
                <div class="dribbble-card p-6 flex flex-col justify-between h-40">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Active Presenters</p>
                        <button class="text-gray-300 hover:text-gray-500"><svg class="w-4 h-4" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                            </svg></button>
                    </div>
                    <div class="flex items-end gap-10">
                        <div>
                            <p class="text-3xl font-black mb-1" id="stat-total-assigned">0</p>
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-[#00A78E]"></span>
                                <span class="text-[10px] font-bold text-gray-400">Assigned</span>
                            </div>
                        </div>
                        <div>
                            <p class="text-3xl font-black mb-1 text-gray-400" id="stat-total-pending">0</p>
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-orange-400"></span>
                                <span class="text-[10px] font-bold text-gray-400">Pending</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="dribbble-card p-6 flex flex-col justify-between h-40">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Total Users</p>
                        <button class="text-gray-300 hover:text-gray-500"><svg class="w-4 h-4" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                            </svg></button>
                    </div>
                    <div class="flex items-center justify-between">
                        <p class="text-5xl font-black" id="stat-total-users">...</p>
                    </div>
                </div>

                <div class="dribbble-card p-6 flex flex-col justify-between h-40">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Admins</p>
                        <button class="text-gray-300 hover:text-gray-500"><svg class="w-4 h-4" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                            </svg></button>
                    </div>
                    <div class="flex items-center justify-between">
                        <p class="text-5xl font-black" id="stat-admins-count">...</p>
                        <div class="flex -space-x-3">
                            <img src="https://i.pravatar.cc/100?u=a1"
                                class="w-10 h-10 rounded-full border-4 border-white" alt="">
                            <img src="https://i.pravatar.cc/100?u=a2"
                                class="w-10 h-10 rounded-full border-4 border-white" alt="">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="flex items-center gap-8 mb-8 border-b border-gray-100 overflow-x-auto pb-px">
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-[#00A78E] text-[#00A78E] text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                    </svg>
                    All Users
                </button>
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    Leaders
                </button>
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                    </svg>
                    Members
                </button>
                <button
                    class="flex items-center gap-2.5 pb-4 px-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 text-xs font-black uppercase tracking-widest whitespace-nowrap">
                    <span class="text-lg leading-none">+</span>
                </button>
            </div>

            <!-- Search & Filter Bar -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
                <div class="relative flex-1 max-w-sm">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5"
                            viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                    <input type="text" id="user-search" onkeyup="filterUsers()"
                        class="w-full pl-12 pr-4 py-3 bg-white border border-gray-100 rounded-xl text-sm font-medium focus:ring-2 focus:ring-[#e6f6f4] outline-none"
                        placeholder="Search">
                </div>

                <div class="flex items-center gap-4">
                    <button
                        class="flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-[#00A78E] transition-colors"><svg
                            class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg> Import</button>
                    <button
                        class="flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-[#00A78E] transition-colors"><svg
                            class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path
                                d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                        </svg> Filter</button>

                    <div class="h-6 w-px bg-gray-100 mx-2"></div>

                    <div class="flex bg-gray-50 p-1 rounded-xl">
                        <button
                            class="bg-white text-[#00A78E] shadow-sm flex items-center gap-2 px-3 py-1.5 rounded-lg text-[11px] font-bold"><svg
                                class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M4 6h16M4 12h16M4 18h16" />
                            </svg> List</button>
                        <button
                            class="text-gray-400 flex items-center gap-2 px-3 py-1.5 rounded-lg text-[11px] font-bold"><svg
                                class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="7" height="7" rx="1" />
                                <rect x="14" y="3" width="7" height="7" rx="1" />
                                <rect x="14" y="14" width="7" height="7" rx="1" />
                                <rect x="3" y="14" width="7" height="7" rx="1" />
                            </svg> Grid</button>
                    </div>

                    <select
                        class="bg-transparent border-none text-[11px] font-bold text-gray-500 outline-none cursor-pointer">
                        <option>Short by: Newest</option>
                        <option>Oldest</option>
                    </select>
                </div>
            </div>

            <!-- Users Table -->
            <div class="dribbble-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="dribbble-table min-w-full">
                        <thead>
                            <tr>
                                <th class="w-16"><input type="checkbox"
                                        class="w-4 h-4 rounded-md border-gray-200 text-[#00A78E] focus:ring-[#00A78E]">
                                </th>
                                <th class="text-left flex items-center gap-2">Profile <svg class="w-3 h-3" fill="none"
                                        stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="m7 15 5 5 5-5" />
                                        <path d="m7 9 5-5 5 5" />
                                    </svg></th>
                                <th class="text-left">Contact <svg class="w-3 h-3 invisible" fill="none"
                                        stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="m7 15 5 5 5-5" />
                                        <path d="m7 9 5-5 5 5" />
                                    </svg></th>
                                <th class="text-left">Cohort / Group <svg class="w-3 h-3 invisible" fill="none"
                                        stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="m7 15 5 5 5-5" />
                                        <path d="m7 9 5-5 5 5" />
                                    </svg></th>
                                <th class="text-left">Status <svg class="w-3 h-3 invisible" fill="none"
                                        stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="m7 15 5 5 5-5" />
                                        <path d="m7 9 5-5 5 5" />
                                    </svg></th>
                                <th class="text-right">Avg Score <svg class="w-3 h-3 invisible" fill="none"
                                        stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="m7 15 5 5 5-5" />
                                        <path d="m7 9 5-5 5 5" />
                                    </svg></th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            <tr>
                                <td colspan="6"
                                    class="px-8 py-20 text-center text-gray-400 font-bold italic animate-pulse">
                                    Initializing user database scan...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Add User -->
    <div id="hs-add-user-modal"
        class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto">
        <div
            class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="bg-white rounded-lg border border-gray-200 shadow-2xl pointer-events-auto overflow-hidden">
                <div class="p-8 border-b border-gray-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-black text-xl text-gray-900 tracking-tight">Register Member</h3>
                        <p class="text-[10px] font-black text-[#00A78E] uppercase tracking-widest mt-1">Clinical
                            Personnel Management</p>
                    </div>
                    <button type="button"
                        class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-50 text-gray-400 hover:text-[#00A78E] transition-colors"
                        data-hs-overlay="#hs-add-user-modal">✕</button>
                </div>
                <form id="add-user-form" class="p-8 space-y-6">
                    <div class="space-y-1.5">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Full
                            Name</label>
                        <input type="text" id="u-name" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all placeholder:text-gray-300 font-medium"
                            placeholder="John Doe">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Email
                            Address</label>
                        <input type="email" id="u-email" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all placeholder:text-gray-300 font-medium"
                            placeholder="john@uni.edu">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Tier
                            Assignment</label>
                        <select id="u-role"
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#e6f6f4] focus:border-[#00A78E] outline-none transition-all appearance-none cursor-pointer font-bold text-gray-600">
                            <option value="MEMBER">Member (Presenter)</option>
                            <option value="LEADER">Leader (Scorer)</option>
                            <option value="ADMIN">System Administrator</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="w-full py-4 bg-[#00A78E] text-white font-black text-xs uppercase tracking-widest rounded-lg shadow-xl shadow-[#00A78E]/20 hover:bg-[#008f7a] transition active:scale-95">Authorize
                        Personnel</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        const token = localStorage.getItem('token');
        let allUsers = [];

        if (!token) window.location.href = '../auth.html';

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                allUsers = Array.isArray(data) ? data : (data.users || data.data || []);

                // Update stats
                document.getElementById('stat-total-users').innerText = allUsers.length;
                document.getElementById('stat-admins-count').innerText = allUsers.filter(u => (u.role || '').toUpperCase() === 'ADMIN').length;

                // New Stats
                const assignedCount = allUsers.filter(u => u.group_id).length;
                const pendingCount = allUsers.length - assignedCount;

                document.getElementById('stat-total-assigned').innerText = assignedCount;
                document.getElementById('stat-total-pending').innerText = pendingCount;

                renderUsers(allUsers);
            } catch (err) { console.error(err); }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-8 py-20 text-center text-gray-400 font-bold italic">No records identified in current scan.</td></tr>';
                return;
            }

            users.forEach(u => {
                const createdAt = u.created_at || u.createdAt || new Date().toISOString();
                const date = new Date(createdAt);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                const uName = u.name || u.full_name || 'Unknown Member';
                const uRole = u.role || 'MEMBER';
                const uEmail = u.email || 'no-email@terminal.edu';

                tbody.innerHTML += `
                    <tr class="group hover:bg-gray-50/50 transition-colors cursor-pointer" onclick="window.location.href='profile.html?id=${u.id}'">
                        <td class="px-8 py-5" onclick="event.stopPropagation()"><input type="checkbox" class="w-4 h-4 rounded-md border-gray-200 text-[#00A78E] focus:ring-[#00A78E]"></td>
                        <td class="px-8 py-5">
                            <div class="flex items-center gap-4">
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(uName)}&background=f3f4f6&color=111827&bold=true" class="w-10 h-10 rounded-full" alt="">
                                <div>
                                    <div class="text-sm font-black text-gray-900 group-hover:text-[#00A78E] transition-colors">${uName}</div>
                                    <div class="text-[10px] font-bold text-gray-400 mt-0.5">Joined ${dateStr} at ${timeStr}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-5">
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-600 flex items-center gap-2"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> ${uEmail}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5 font-bold text-xs text-gray-500 uppercase tracking-widest">
                             Personnel
                        </td>
                        <td class="px-8 py-5">
                            <span class="px-3 py-1 rounded-full bg-gray-100 text-[10px] font-black uppercase text-gray-600 border border-gray-200">${uRole}</span>
                        </td>
                        <td class="px-8 py-5 text-right font-black text-xs text-gray-400">
                             REF ID: 00${u.id}
                        </td>
                    </tr>
                `;
            });
        }

        function filterUsers() {
            const query = document.getElementById('user-search').value.toLowerCase();
            const filtered = allUsers.filter(u =>
                u.name.toLowerCase().includes(query) ||
                u.email.toLowerCase().includes(query)
            );
            renderUsers(filtered);
        }

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('u-name').value,
                email: document.getElementById('u-email').value,
                password: "ScoreFlow2026!",
                role: document.getElementById('u-role').value
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    HSOverlay.close('#hs-add-user-modal');
                    document.getElementById('add-user-form').reset();
                    fetchUsers();
                } else {
                    const data = await res.json();
                    alert(data.error);
                }
            } catch (err) { alert("Failed to add user."); }
        });
    </script>

    <!-- Modal: Add User -->
    <div id="hs-add-user-modal"
        class="hs-overlay hidden w-full h-full fixed top-0 left-0 z-[60] overflow-x-hidden overflow-y-auto bg-black/5 backdrop-blur-sm">
        <div
            class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-3.5rem)] flex items-center justify-center">
            <div class="glass-modal flex flex-col shadow-2xl rounded-2xl w-full"
                style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="flex justify-between items-center py-5 px-8 border-b border-gray-100">
                    <h3 class="font-black text-gray-800 text-lg tracking-tight">
                        Add New Personnel
                    </h3>
                    <button type="button"
                        class="hs-dropdown-toggle inline-flex flex-shrink-0 justify-center items-center h-8 w-8 rounded-lg text-gray-500 hover:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 focus:ring-offset-white transition-all text-sm"
                        data-hs-overlay="#hs-add-user-modal">
                        <span class="sr-only">Close</span>
                        <svg class="w-3.5 h-3.5" width="8" height="8" viewBox="0 0 8 8" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path

                                Name</label>
                            <input type="text" id="u-name" placeholder="First Last"
                                class="bg-gray-50 border border-gray-100 text-gray-900 text-sm rounded-xl focus:ring-[#00A78E] focus:border-[#00A78E] block w-full p-3 font-bold outline-none transition-all"

                        <div>
                            <label for="u-email"
                                class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">School

                            <input type="email" id="u-email" placeholder="name@school.edu"
                                class="bg-gray-50 border border-gray-100 text-gray-900 text-sm rounded-xl focus:ring-[#00A78E] focus:border-[#00A78E] block w-full p-3 font-bold outline-none transition-all"
                                required>
                        </div>

                        <!-- Role -->
                        <div>
                            <label for="u-role"
                                class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">System
                                Role</label>
                            <select id="u-role"
                                class="bg-gray-50 border border-gray-100 text-gray-900 text-sm rounded-xl focus:ring-[#00A78E] focus:border-[#00A78E] block w-full p-3 font-bold outline-none transition-all">
                                <option value="MEMBER">Member (Student)</option>
                                <option value="LEADER">Group Leader</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                        </div>
                    </form>
                </div>

                        class="py-2.5 px-4 inline-flex justify-center items-center gap-2 rounded-xl border border-transparent font-bold text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-0 transition-all text-xs uppercase tracking-widest"

                        Cancel

                    <button type="submit" form="add-user-form"
                        class="py-2.5 px-6 inline-flex justify-center items-center gap-2 rounded-xl border border-transparent font-black bg-[#00A78E] text-white hover:bg-[#008f7a] focus:outline-none focus:ring-2 focus:ring-[#00A78E] focus:ring-offset-2 transition-all text-sm shadow-lg shadow-[#00A78E]/30">
