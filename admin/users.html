<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | I and I ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Mobile Header -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 py-2 lg:hidden">
        <div class="flex justify-between items-center">
            <a class="font-bold text-xl text-indigo-600" href="#">I and I</a>
            <button type="button" class="p-2 border rounded-lg" data-hs-overlay="#hs-sidebar-footer">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full max-h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5 text-sm">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg" href="users.html">Users</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">Groups</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="rounds.html">Rounds</a></li>
                    <li class="pt-4 border-t mt-4"><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100 font-semibold" href="score.html">Scoring Mode</a></li>
                </ul>
            </nav>

            <footer class="mt-auto p-4 border-t border-gray-200">
                <button onclick="logout()" class="text-xs text-red-600 font-bold p-2 hover:underline">Sign Out</button>
            </footer>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-y-4 mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">User Management</h1>
                    <p class="text-slate-500">View and manage roles for all members of the system.</p>
                </div>
                <button type="button" data-hs-overlay="#hs-add-user-modal" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-bold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    Add New User
                </button>
            </header>

            <!-- Search and Filter -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-6 shadow-sm">
                <div class="relative">
                    <input type="text" id="user-search" onkeyup="filterUsers()" class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-xl text-sm bg-slate-50 outline-none focus:ring-4 focus:ring-indigo-50" placeholder="Search by name or email...">
                    <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none ps-4">
                        <svg class="size-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-4 text-start text-xs font-bold text-slate-500 uppercase tracking-widest">User</th>
                                <th class="px-6 py-4 text-start text-xs font-bold text-slate-500 uppercase tracking-widest">Role</th>
                                <th class="px-6 py-4 text-start text-xs font-bold text-slate-500 uppercase tracking-widest">Joined Date</th>
                                <th class="px-6 py-4 text-end text-xs font-bold text-slate-500 uppercase tracking-widest">Action</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body" class="divide-y divide-slate-200">
                            <tr><td colspan="4" class="px-6 py-10 text-center text-slate-400">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Add User -->
    <div id="hs-add-user-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-white border shadow-sm rounded-2xl pointer-events-auto overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Register New Member</h3>
                    <button type="button" class="text-slate-400 hover:text-slate-600" data-hs-overlay="#hs-add-user-modal">✕</button>
                </div>
                <form id="add-user-form" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                        <input type="text" id="u-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 outline-none" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                        <input type="email" id="u-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 outline-none" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Assign Role</label>
                        <select id="u-role" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 outline-none">
                            <option value="MEMBER">Member (Presenter)</option>
                            <option value="LEADER">Leader (Scorer)</option>
                            <option value="ADMIN">Administrator</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Initial Password</label>
                        <input type="text" id="u-pass" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 outline-none" value="ScoreFlow123!">
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition">Create User</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        let allUsers = [];

        if (!token) window.location.href = 'login.html';

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allUsers = await res.json();
                renderUsers(allUsers);
            } catch (err) { console.error(err); }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-slate-400">No users found.</td></tr>';
                return;
            }

            users.forEach(u => {
                const date = new Date(u.created_at).toLocaleDateString();
                const roleBadge = u.role === 'ADMIN' ? 'bg-purple-100 text-purple-700' : (u.role === 'LEADER' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="size-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">
                                    ${u.name.charAt(0)}
                                </div>
                                <div>
                                    <div class="text-sm font-bold text-slate-800">${u.name}</div>
                                    <div class="text-[10px] text-slate-400">${u.email}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="py-1 px-3 rounded-full text-[10px] font-black uppercase tracking-tighter ${roleBadge}">
                                ${u.role}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-500">${date}</td>
                        <td class="px-6 py-4 text-end">
                            <a href="profile.html?id=${u.id}" class="text-xs font-black text-indigo-600 hover:underline uppercase tracking-widest">View Profile</a>
                        </td>
                    </tr>
                `;
            });
        }

        function filterUsers() {
            const query = document.getElementById('user-search').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.name.toLowerCase().includes(query) || 
                u.email.toLowerCase().includes(query)
            );
            renderUsers(filtered);
        }

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('u-name').value,
                email: document.getElementById('u-email').value,
                password: document.getElementById('u-pass').value,
                role: document.getElementById('u-role').value
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    HSOverlay.close('#hs-add-user-modal');
                    document.getElementById('add-user-form').reset();
                    fetchUsers();
                } else {
                    const data = await res.json();
                    alert(data.error);
                }
            } catch (err) { alert("Failed to add user."); }
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        fetchUsers();
    </script>
</body>
</html>
