<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-indigo-600 tracking-tight">ScoreFlow</h1>
            <p class="text-slate-500 mt-2 font-medium">Welcome back! Please sign in to your account.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200 p-8">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all" placeholder="admin@example.com">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••">
                </div>

                <div id="error-box" class="hidden p-3 rounded-xl bg-red-50 border border-red-100 text-red-600 text-xs font-bold text-center"></div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-xl shadow-indigo-100">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-500">Don't have a leader account? <a href="register.html" class="text-indigo-600 font-bold hover:underline">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('submit-btn');
            
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Login failed");

                // Save Auth Data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                window.location.href = '/';
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('hidden');
                submitBtn.disabled = false;
            }
        });

        // Auto-redirect if already logged in
        if (localStorage.getItem('token')) window.location.href = 'dashboard.html';
    </script>
</body>
</html>
