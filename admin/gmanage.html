<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Assignments | ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-slate-50 min-h-full font-sans">

    <div id="mobile-header-container"></div>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto animate-fade-in">

            <header class="mb-12">
                <h1 class="text-4xl font-black text-slate-900 tracking-tight">Team Assignments</h1>
                <p class="text-slate-500 font-medium">Re-orient research personnel within active cohorts.</p>
            </header>

            <div class="grid lg:grid-cols-3 gap-10">

                <!-- Left: Group Selection List -->
                <div class="lg:col-span-1 space-y-4">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">1. Target Cohort
                    </h3>
                    <div id="group-list"
                        class="glass-card rounded-[2.5rem] border-slate-200/50 shadow-2xl shadow-slate-200/40 divide-y divide-slate-100 overflow-hidden">
                        <div class="p-8 text-center text-slate-400 animate-pulse font-bold italic">Loading cohorts...
                        </div>
                    </div>
                </div>

                <!-- Right: Assignment Interface -->
                <div class="lg:col-span-2">
                    <!-- Empty State -->
                    <div id="no-selection-state"
                        class="glass-card rounded-[3rem] border-slate-200/50 border-dashed h-[600px] flex flex-col items-center justify-center text-slate-300 shadow-sm transition-all duration-500">
                        <div class="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mb-6">
                            <svg class="w-10 h-10 text-slate-200" fill="none" stroke="currentColor" stroke-width="2.5"
                                viewBox="0 0 24 24">
                                <path d="M18 18.72a9.094 9.094 0 0 0 3.741-3.418M11.25 15l3 3 6-6" />
                            </svg>
                        </div>
                        <p class="font-black text-xs uppercase tracking-widest">Select a research cohort to proceed</p>
                    </div>

                    <!-- Active Panel -->
                    <div id="manage-panel" class="hidden space-y-8 animate-slide-up">
                        <div
                            class="bg-rose-600 rounded-[3rem] p-10 text-white shadow-2xl shadow-rose-100 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div>
                                <span
                                    class="text-[10px] font-black uppercase tracking-[0.2em] text-rose-300">Operational
                                    Target</span>
                                <h2 id="active-group-name" class="text-3xl font-black tracking-tight mt-1">Group Name
                                </h2>
                            </div>
                            <div
                                class="px-5 py-2 bg-white/10 rounded-2xl backdrop-blur-md border border-white/10 text-[10px] font-black uppercase tracking-widest">
                                Clearance LVL: Admin
                            </div>
                        </div>

                        <div
                            class="glass-card rounded-[3rem] border-slate-200/50 shadow-2xl shadow-slate-200/40 overflow-hidden">
                            <div
                                class="p-8 border-b border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row justify-between items-center gap-6">
                                <div>
                                    <h4 class="font-black text-slate-900 text-sm">Personnel Routing</h4>
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">2.
                                        Assign members to this team</p>
                                </div>
                                <div class="relative w-full sm:w-72">
                                    <input type="text" id="user-search" onkeyup="filterUsers()"
                                        class="w-full px-6 py-3.5 bg-white border border-slate-200 rounded-2xl text-[11px] font-bold outline-none focus:ring-4 focus:ring-rose-50 focus:border-rose-500 transition-all"
                                        placeholder="Search PERSONNEL...">
                                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor"
                                            stroke-width="2.5" viewBox="0 0 24 24">
                                            <circle cx="11" cy="11" r="8" />
                                            <path d="m21 21-4.3-4.3" />
                                        </svg>
                                    </div>
                                </div>
                            </div>

                            <div id="user-pool"
                                class="grid sm:grid-cols-2 gap-4 p-8 max-h-[500px] overflow-y-auto custom-scrollbar">
                                <!-- Users injected here -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        const token = localStorage.getItem('token');

        let activeGroupId = null;
        let allUsers = [];
        let allGroups = [];

        if (!token) window.location.href = 'login.html';

        async function init() {
            try {
                const res = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allGroups = await res.json();
                renderGroups();
            } catch (err) { console.error(err); }
        }

        function renderGroups() {
            const list = document.getElementById('group-list');
            list.innerHTML = '';
            allGroups.forEach(g => {
                const isActive = activeGroupId === g.id;
                list.innerHTML += `
                    <button onclick="selectGroup(${g.id}, '${g.name}')" 
                            class="w-full text-left p-8 transition-all flex items-center justify-between group ${isActive ? 'bg-rose-50 shadow-inner' : 'hover:bg-slate-50/50'}">
                        <div>
                            <div class="font-black ${isActive ? 'text-rose-600' : 'text-slate-800'} text-sm uppercase tracking-tight">${g.name}</div>
                            <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">ID: REF-0${g.id}</div>
                        </div>
                        <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-rose-600 text-white' : 'bg-slate-50 text-slate-300 group-hover:bg-slate-100 group-hover:text-slate-400'} flex items-center justify-center transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                        </div>
                    </button>
                `;
            });
        }

        function selectGroup(id, name) {
            activeGroupId = id;
            document.getElementById('no-selection-state').classList.add('hidden');
            const panel = document.getElementById('manage-panel');
            panel.classList.remove('hidden');
            document.getElementById('active-group-name').innerText = name;

            renderGroups();
            fetchUsersWithStatus();
        }

        async function fetchUsersWithStatus() {
            const pool = document.getElementById('user-pool');
            pool.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400 animate-pulse font-bold italic">Scanning clinical personnel status...</div>';

            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allUsers = await res.json();

                const memRes = await fetch(`${API_URL}/groups/${activeGroupId}/members`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const currentMembers = await memRes.json();
                const memberIds = Array.isArray(currentMembers) ? currentMembers.map(m => m.id) : [];

                renderUserPool(memberIds);
            } catch (err) { console.error(err); }
        }

        function renderUserPool(memberIds) {
            const pool = document.getElementById('user-pool');
            pool.innerHTML = '';

            allUsers.forEach(u => {
                const isAlreadyInThisGroup = memberIds.includes(u.id);

                pool.innerHTML += `
                    <div class="flex items-center justify-between p-6 border shadow-sm ${isAlreadyInThisGroup ? 'border-rose-100 bg-rose-50/20' : 'border-slate-100 bg-white hover:border-slate-300'} rounded-3xl transition-all group">
                        <div class="flex items-center gap-4 truncate">
                            <div class="w-8 h-8 rounded-full ${isAlreadyInThisGroup ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-400'} flex items-center justify-center font-black text-[10px]">
                                ${u.name.charAt(0)}
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-black text-slate-900 truncate">${u.name}</p>
                                <span class="text-[8px] font-black uppercase tracking-widest text-slate-400">
                                    ${u.role}
                                </span>
                            </div>
                        </div>
                        
                        ${isAlreadyInThisGroup ?
                        `<span class="text-rose-600 font-black text-[10px] uppercase tracking-widest pr-2">Linked</span>` :
                        `<button onclick="assignMember(${u.id}, this)" 
                                    class="h-8 px-4 bg-slate-900 text-white rounded-xl flex items-center justify-center text-[10px] font-black uppercase tracking-widest hover:bg-rose-600 transition-all shadow-lg active:scale-95">
                                Link
                            </button>`
                    }
                    </div>
                `;
            });
        }

        async function assignMember(userId, btn) {
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin size-3 border-2 border-white border-t-transparent rounded-full font-black"></span>`;

            try {
                const res = await fetch(`${API_URL}/groups/members`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ group_id: activeGroupId, user_id: userId })
                });

                if (res.ok) {
                    btn.className = "h-8 px-4 bg-emerald-500 text-white rounded-xl flex items-center justify-center text-[10px] font-black shadow-lg";
                    btn.innerHTML = "✓ Linked";
                    setTimeout(() => fetchUsersWithStatus(), 600);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = "Link";
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = "Link";
            }
        }

        function filterUsers() {
            const query = document.getElementById('user-search').value.toLowerCase();
            const cards = document.getElementById('user-pool').children;
            for (let card of cards) {
                const name = card.querySelector('p').innerText.toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            }
        }

        init();
    </script>
</body>

</html>
