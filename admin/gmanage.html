<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Group Members | I and I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">Back to Groups</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Manage Teams</h1>
                    <p class="text-slate-500">Create groups and assign presenters.</p>
                </div>
                <button data-hs-overlay="#hs-new-group-modal" class="py-2 px-4 bg-indigo-600 text-white font-bold rounded-xl text-sm shadow-lg hover:bg-indigo-700 transition">+ New Group</button>
            </header>

            <div class="grid lg:grid-cols-2 gap-8">
                <!-- Left: List of Groups -->
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b bg-slate-50 font-bold text-slate-700">Select Group to Manage</div>
                    <div id="group-selector-list" class="divide-y divide-slate-100">
                        <!-- Groups injected here -->
                    </div>
                </div>

                <!-- Right: Assign Presenters (Hidden until group is selected) -->
                <div id="assignment-panel" class="hidden space-y-6">
                    <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-xl shadow-indigo-100">
                        <h3 class="text-xs font-bold uppercase tracking-widest text-indigo-200 mb-2">Managing Members for:</h3>
                        <p id="active-group-display" class="text-2xl font-black">Group Name</p>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h4 class="font-bold text-slate-800 mb-4">Assign a Presenter</h4>
                        <div class="space-y-3" id="presenter-pool">
                            <!-- Presenters (Users) injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: New Group -->
    <div id="hs-new-group-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-white border shadow-sm rounded-2xl pointer-events-auto">
                <div class="p-4 border-b font-bold">Create New Group</div>
                <form id="new-group-form" class="p-6 space-y-4">
                    <input type="text" id="g-name" placeholder="Group Name" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    <textarea id="g-desc" placeholder="Brief Description" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" rows="3"></textarea>
<a href="add-group.html" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">
    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    Create New Group
</a>                </form>
            </div>
        </div>
    </div>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        let selectedGroupId = null;

        async function loadGroups() {
            const res = await fetch(`${API_URL}/groups`, { headers: { 'Authorization': `Bearer ${token}` } });
            const groups = await res.json();
            const list = document.getElementById('group-selector-list');
            list.innerHTML = '';
            groups.forEach(g => {
                list.innerHTML += `
                    <button onclick="selectGroup(${g.id}, '${g.name}')" class="w-full text-left p-4 hover:bg-slate-50 transition flex justify-between items-center group">
                        <span class="font-bold text-slate-700">${g.name}</span>
                        <svg class="size-4 text-slate-300 group-hover:text-indigo-600" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                    </button>
                `;
            });
        }

        async function selectGroup(id, name) {
            selectedGroupId = id;
            document.getElementById('active-group-display').innerText = name;
            document.getElementById('assignment-panel').classList.remove('hidden');
            loadPresenters();
        }

        async function loadPresenters() {
            const res = await fetch(`${API_URL}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const users = await res.json();
            const pool = document.getElementById('presenter-pool');
            pool.innerHTML = '';
            
            // Only show members who could be presenters
            users.forEach(u => {
                pool.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-sm font-bold text-slate-700">${u.name}</span>
                        <button onclick="addUserToGroup(${u.id})" class="text-[10px] font-black uppercase bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700 transition">Add to Team</button>
                    </div>
                `;
            });
        }

       async function addUserToGroup(userId, btn) {
    // 1. Visual feedback
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '...';

    try {
        const res = await fetch(`${API_URL}/groups/members`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            },
            body: JSON.stringify({ 
                group_id: activeGroupId, 
                user_id: userId          
            })
        });

        const data = await res.json();

        if (res.ok) {
            // Success: Change button to a green checkmark
            btn.className = "size-8 flex items-center justify-center bg-green-500 text-white rounded-lg";
            btn.innerHTML = '✓';
        } else {
            // Show the specific error (like "User already in group")
            alert(data.error);
            btn.disabled = false;
            btn.innerHTML = originalContent;
        }
    } catch (err) {
        console.error("Assignment failed:", err);
        alert("Check your internet connection or API URL");
        btn.disabled = false;
        btn.innerHTML = originalContent;
    }
}

        document.getElementById('new-group-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('g-name').value;
            const description = document.getElementById('g-desc').value;
            const res = await fetch(`${API_URL}/groups`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, description })
            });
            if (res.ok) {
                HSOverlay.close('#hs-new-group-modal');
                loadGroups();
            }
        });

        loadGroups();
    </script>
</body>
</html>
