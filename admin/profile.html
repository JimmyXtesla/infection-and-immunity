<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | I and I ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Mobile Header (Consistent with other pages) -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 py-2 lg:hidden">
        <div class="flex justify-between items-center">
            <a class="font-bold text-xl text-indigo-600" href="#">I and I</a>
            <button type="button" class="p-2 border rounded-lg" data-hs-overlay="#hs-sidebar-footer">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar (Consistent with other pages) -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5 text-sm">
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="dashboard.html">Dashboard</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg" href="users.html">Users</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">Groups</a></li>
                    <li><a class="flex items-center gap-x-3 py-2 px-2.5 text-gray-700 rounded-lg hover:bg-gray-100" href="score.html">Scoring Mode</a></li>
                </ul>
            </nav>
            <footer class="mt-auto p-4 border-t border-gray-200">
                <button onclick="logout()" class="text-sm text-red-600 font-bold p-2">Sign Out</button>
            </footer>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <!-- Breadcrumbs -->
            <nav class="flex items-center gap-x-3 mb-6 text-sm text-slate-500">
                <a href="users.html" class="hover:text-indigo-600">Users</a>
                <svg class="size-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                <span id="breadcrumb-name" class="font-bold text-indigo-600">User Performance</span>
            </nav>

            <!-- Profile Header -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-8 shadow-sm">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <div class="size-24 rounded-full bg-indigo-600 flex items-center justify-center text-white text-3xl font-black" id="profile-initials">..</div>
                    <div class="text-center md:text-left grow">
                        <h1 class="text-3xl font-black text-slate-900" id="profile-name">Loading...</h1>
                        <p class="text-slate-500" id="profile-role">User Details</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="window.print()" class="py-2 px-4 text-sm font-bold rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">Print Report</button>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Global Average</p>
                    <p class="text-4xl font-black text-indigo-600 mt-1" id="stat-avg">0.00</p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Sessions</p>
                    <p class="text-4xl font-black text-slate-900 mt-1" id="stat-count">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Latest Score</p>
                    <p class="text-4xl font-black text-slate-900 mt-1" id="stat-latest">0.0</p>
                </div>
            </div>

            <div class="grid lg:grid-cols-3 gap-8">
                <!-- Left: Matrix -->
                <div class="lg:col-span-1 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-6">Skill Matrix (Avg)</h3>
                    <div class="space-y-5" id="skill-matrix">
                        <p class="text-slate-400 text-sm">Loading skills data...</p>
                    </div>
                </div>

                <!-- Right: History -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800">Evaluation History</h3>
                        </div>
                        <div class="divide-y divide-slate-100" id="history-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API_URL = "https://scorer-api.vercel.app/api";
        const token = localStorage.getItem('token');
        
        // Get User ID from URL (?id=X)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!token) window.location.href = 'login.html';
        if (!userId) window.location.href = 'users.html';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                renderProfile(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderProfile(data) {
            const { user, evaluations } = data;
            
            // Header
            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('breadcrumb-name').innerText = user.name;
            document.getElementById('profile-initials').innerText = user.name.charAt(0).toUpperCase();
            document.getElementById('profile-role').innerText = `${user.role} • ${user.email}`;

            // Basic Stats
            document.getElementById('stat-count').innerText = evaluations.length;
            
            if (evaluations.length > 0) {
                const totalAvg = evaluations.reduce((acc, curr) => acc + parseFloat(curr.average_score), 0) / evaluations.length;
                document.getElementById('stat-avg').innerText = totalAvg.toFixed(2);
                document.getElementById('stat-latest').innerText = parseFloat(evaluations[0].average_score).toFixed(1);
                
                renderMatrix(evaluations);
                renderHistory(evaluations);
            } else {
                document.getElementById('history-list').innerHTML = '<p class="p-10 text-center text-slate-400">No evaluations found for this user.</p>';
            }
        }

        function renderMatrix(evals) {
            const matrix = document.getElementById('skill-matrix');
            
            // Criteria to calculate
            const criteria = [
                { key: 'score_slide_style', label: 'Style' },
                { key: 'score_content', label: 'Content' },
                { key: 'score_clarity', label: 'Clarity' },
                { key: 'score_timing', label: 'Timing' },
                { key: 'score_wow_factor', label: 'Wow Factor' },
                { key: 'score_clear_response', label: 'Response Clarity' },
                { key: 'score_accurate_response', label: 'Accuracy' },
                { key: 'score_conciseness', label: 'Conciseness' }
            ];

            matrix.innerHTML = '';
            
            criteria.forEach(c => {
                const avg = evals.reduce((acc, curr) => acc + parseFloat(curr[c.key]), 0) / evals.length;
                const percentage = (avg * 10); // 0-10 scale to 0-100%

                matrix.innerHTML += `
                    <div>
                        <div class="flex justify-between text-xs mb-2">
                            <span class="font-bold text-slate-600 uppercase">${c.label}</span>
                            <span class="text-indigo-600 font-bold">${avg.toFixed(1)}</span>
                        </div>
                        <div class="h-1.5 w-full bg-slate-100 rounded-full">
                            <div class="h-1.5 bg-indigo-500 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            });
        }

        function renderHistory(evals) {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            evals.forEach(e => {
                const date = new Date(e.created_at).toLocaleDateString();
                list.innerHTML += `
                    <div class="p-6 hover:bg-slate-50 transition flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-slate-800">Evaluated in ${e.group_name}</p>
                            <p class="text-xs text-slate-500">${date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black text-indigo-600">${parseFloat(e.average_score).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 grid grid-cols-2 gap-4">
                         <div class="bg-green-50 p-3 rounded-lg text-[11px]">
                            <span class="font-bold text-green-700 uppercase block mb-1">Strengths</span>
                            <span class="text-slate-600">${e.strengths || 'None recorded'}</span>
                         </div>
                         <div class="bg-orange-50 p-3 rounded-lg text-[11px]">
                            <span class="font-bold text-orange-700 uppercase block mb-1">Improvements</span>
                            <span class="text-slate-600">${e.improvements || 'None recorded'}</span>
                         </div>
                    </div>
                `;
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        loadProfile();
    </script>
</body>
</html>
