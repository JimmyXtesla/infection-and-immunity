<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ScoreFlow Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Preline UI Styles -->
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link rel="stylesheet" href="../shared/css/style.css">
    <style>
        [box-sizing: border-box;]
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Mobile Header/Toggle -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 sm:px-6 md:px-8 lg:hidden">
        <div class="flex justify-between items-center py-2">
            <!-- Brand -->
            <a class="flex-none font-bold text-xl" href="#">ScoreFlow</a>
            
            <!-- Navigation Toggle -->
            <button type="button" class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50" data-hs-overlay="#hs-sidebar-footer" aria-controls="hs-sidebar-footer" aria-label="Toggle navigation">
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
                Menu
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1" aria-label="Sidebar">
        <div class="relative flex flex-col h-full max-h-full">
            <!-- Header -->
            <header class="p-4 flex justify-between items-center">
                <a class="flex-none font-black text-2xl text-indigo-600" href="#" aria-label="Brand">ScoreFlow</a>
                <div class="lg:hidden">
                    <button type="button" class="size-8 flex justify-center items-center text-gray-500 hover:bg-gray-100 rounded-full" data-hs-overlay="#hs-sidebar-footer">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </header>

            <!-- Navigation Body -->
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5">
                    <li>
                        <a class="flex items-center gap-x-3 py-2 px-2.5 bg-gray-100 text-sm text-gray-800 rounded-lg font-medium" href="#">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            Dashboard
                        </a>
                    </li>

                    <!-- Example Accordion -->
                    <li class="hs-accordion" id="users-accordion">
                        <button type="button" class="hs-accordion-toggle w-full text-start flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                            Users
                            <svg class="hs-accordion-active:rotate-180 ms-auto size-4 transition-transform" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div id="users-accordion-child" class="hs-accordion-content w-full overflow-hidden transition-[height] duration-300 hidden">
                            <ul class="pt-1 ps-8 space-y-1">
                                <li><a class="block py-2 px-2.5 text-sm text-gray-600 hover:text-indigo-600" href="#">All Users</a></li>
                                <li><a class="block py-2 px-2.5 text-sm text-gray-600 hover:text-indigo-600" href="#">Permissions</a></li>
                            </ul>
                        </div>
                    </li>

                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="#">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            Calendar <span class="ms-auto py-0.5 px-1.5 text-[10px] bg-blue-100 text-blue-800 rounded-full font-bold uppercase">New</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Footer -->
            <footer class="mt-auto p-4 border-t border-gray-200">
                <div class="hs-dropdown relative w-full inline-flex">
                    <button id="hs-dropdown-footer" type="button" class="w-full inline-flex items-center gap-x-2 p-2 text-sm text-gray-800 rounded-md hover:bg-gray-100">
                        <img class="size-6 rounded-full" src="https://images.unsplash.com/photo-1734122415415-88cb1d7d5dc0?q=80&w=100&h=100&auto=format&fit=facearea&facepad=3" alt="Avatar">
                        <span class="truncate">Mia Hudson</span>
                        <svg class="size-3.5 ms-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
                    </button>
                    <!-- Dropdown content would go here -->
                </div>
            </footer>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            <header class="mb-10">
                <h1 class="text-3xl font-black text-slate-900">Dashboard Overview</h1>
                <p class="text-slate-500">Welcome back, Administrator.</p>
            </header>

            <!-- Stats Bento Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Groups</p>
                    <p id="total-groups" class="text-4xl font-black text-slate-900 mt-2">12</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Global Average</p>
                    <p id="global-avg" class="text-4xl font-black text-indigo-600 mt-2">84.2</p>
                </div>
                <!-- Highlight Card -->
                <div class="bg-indigo-600 p-6 rounded-xl shadow-lg text-white relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-[10px] font-bold text-indigo-200 uppercase tracking-widest">Upcoming</p>
                        <p class="text-xl font-bold mt-2">Next: Group 3</p>
                        <p class="text-sm opacity-80">Monday, 09:00 AM</p>
                    </div>
                    <!-- Decorative Circle -->
                    <div class="absolute -right-4 -bottom-4 size-24 bg-white/10 rounded-full"></div>
                </div>
            </div>

            <!-- Performance Chart -->
            <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="font-bold text-lg">Quick Performance Chart</h3>
                    <span class="text-xs text-slate-400">Last 7 Days</span>
                </div>
                <div id="dashboard-chart" class="h-64 flex items-end gap-3 md:gap-6">
                    <!-- Example Bars -->
                    <div class="bg-indigo-100 w-full rounded-t-lg transition-all hover:bg-indigo-500" style="height: 40%"></div>
                    <div class="bg-indigo-100 w-full rounded-t-lg transition-all hover:bg-indigo-500" style="height: 70%"></div>
                    <div class="bg-indigo-600 w-full rounded-t-lg" style="height: 90%"></div>
                    <div class="bg-indigo-100 w-full rounded-t-lg transition-all hover:bg-indigo-500" style="height: 60%"></div>
                    <div class="bg-indigo-100 w-full rounded-t-lg transition-all hover:bg-indigo-500" style="height: 80%"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global JS Requirements -->
    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script src="../shared/js/data-store.js"></script>
    <script src="admin-core.js"></script>
</body>
</html>
