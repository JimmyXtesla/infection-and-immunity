<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | I and I ScoreFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://preline.co/assets/css/main.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-full">

    <!-- Mobile Header -->
    <div class="sticky top-0 inset-x-0 z-20 bg-white border-y px-4 py-2 lg:hidden">
        <div class="flex justify-between items-center">
            <a class="font-bold text-xl text-indigo-600" href="#">I and I</a>
            <button type="button" class="p-2 border rounded-lg" data-hs-overlay="#hs-sidebar-footer">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="hs-sidebar-footer" class="hs-overlay [--auto-close:lg] lg:block lg:translate-x-0 lg:end-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden fixed top-0 start-0 bottom-0 z-[60] bg-white border-e border-gray-200" role="dialog" tabindex="-1">
        <div class="relative flex flex-col h-full max-h-full">
            <header class="p-4"><a class="font-black text-2xl text-indigo-600" href="dashboard.html">I and I</a></header>
            
            <nav class="h-full overflow-y-auto p-3">
                <ul class="space-y-1.5">
                    <li>
                        <a class="flex items-center gap-x-3 py-2 px-2.5 bg-indigo-50 text-indigo-600 rounded-lg font-bold" href="dashboard.html">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="users.html">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                            Users
                        </a>
                    </li>
                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="groups.html">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                            Groups
                        </a>
                    </li>
                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100" href="rounds.html">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                            Rounds
                        </a>
                    </li>
                    <li class="pt-4 border-t mt-4">
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100 font-semibold" href="score.html">
                            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
                            Scoring Mode
                        </a>
                    </li>
                </ul>
            </nav>

            <footer class="mt-auto p-4 border-t border-gray-200">
                <div class="hs-dropdown relative w-full inline-flex">
                    <button id="hs-dropdown-footer" type="button" class="w-full inline-flex items-center gap-x-2 p-2 text-sm text-gray-800 rounded-md hover:bg-gray-100 outline-none">
                        <div class="size-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs" id="user-initials">..</div>
                        <span class="truncate font-semibold" id="sidebar-username">Admin</span>
                        <svg class="size-3.5 ms-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
                    </button>
                    <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden z-10 bg-white shadow-md rounded-lg p-2 mt-2 border border-gray-200 w-full" aria-labelledby="hs-dropdown-footer">
                        <button onclick="logout()" class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-red-600 hover:bg-gray-100 w-full text-left font-bold">
                            Sign Out
                        </button>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ps-64">
        <div class="p-4 sm:p-6 md:p-10 lg:p-12 max-w-[85rem] mx-auto">
            
            <header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Dashboard</h1>
                    <p class="text-slate-500">Welcome back, <span id="welcome-name">...</span>.</p>
                </div>
                <div class="bg-indigo-600 text-white px-4 py-2 rounded-xl flex items-center gap-3 shadow-lg shadow-indigo-100">
                    <div class="size-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span class="text-xs font-black uppercase tracking-widest" id="active-round-display">Loading Round...</span>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6  shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Groups</p>
                    <p id="total-groups" class="text-4xl font-black text-slate-900 mt-2">0</p>
                </div>
                <div class="bg-white p-6  shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Rotation Average</p>
                    <p id="global-avg" class="text-4xl font-black text-indigo-600 mt-2">0.00</p>
                </div>
                <div class="bg-white p-6  shadow-sm border border-slate-200 flex flex-col justify-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Quick Actions</p>
                    <div class="flex gap-2">
                        <a href="score.html" class="flex-1 text-center py-2 bg-slate-900 text-white text-xs font-bold rounded-lg hover:bg-slate-800 transition">Scoring</a>
                        <a href="rounds.html" class="flex-1 text-center py-2 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-lg hover:bg-indigo-100 transition">Manage Rounds</a>
                    </div>
                </div>
            </div>

            <!-- Visual Chart Area -->
            <div class="bg-white p-6 sm:p-8  border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="font-bold text-lg text-slate-800">Rotation Performance</h3>
                    <span class="text-xs font-bold text-slate-400 uppercase">Current 3-Month Cycle</span>
                </div>
                <div id="dashboard-chart" class="h-64 flex items-end gap-3 md:gap-6">
                    <!-- Visual Placeholders -->
                    <div class="bg-indigo-100 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 40%"></div>
                    <div class="bg-indigo-200 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 70%"></div>
                    <div class="bg-indigo-600 w-full rounded-t-xl" style="height: 90%"></div>
                    <div class="bg-indigo-300 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 60%"></div>
                    <div class="bg-indigo-400 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 80%"></div>
                    <div class="bg-indigo-100 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 30%"></div>
                    <div class="bg-indigo-500 w-full rounded-t-xl transition-all hover:bg-indigo-500" style="height: 55%"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://preline.co/assets/vendor/preline/dist/preline.js"></script>
    <script>
        const API_URL = "https://scorer-api.vercel.app/api"; 
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        // 1. Auth Guard
        if (!token) window.location.href = 'login.html';

        // 2. Fetch Dashboard Data
        async function fetchStats() {
            // Update UI with User Info
            if (user) {
                document.getElementById('sidebar-username').innerText = user.name;
                document.getElementById('welcome-name').innerText = user.name;
                document.getElementById('user-initials').innerText = user.name.charAt(0).toUpperCase();
            }

            try {
                const response = await fetch(`${API_URL}/dashboard/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) logout();

                const data = await response.json();

                // Update Stats
                document.getElementById('total-groups').innerText = data.totalGroups;
                document.getElementById('global-avg').innerText = data.globalAverage;
                document.getElementById('active-round-display').innerText = data.currentRoundName;

            } catch (err) {
                console.error("Dashboard fetch failed:", err);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Initialize
        fetchStats();
    </script>
</body>
</html>
