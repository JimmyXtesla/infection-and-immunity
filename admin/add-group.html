<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Group | ScoreFlow Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen">
    <!-- Sidebar -->
    <!-- ... -->

    <main class="flex-1 p-6 md:p-12">
        <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100">
            <header class="mb-8">
                <a href="schedules.html" class="text-indigo-600 text-sm font-bold flex items-center gap-2 mb-4">
                    ← Back to Schedules
                </a>
                <h1 class="text-3xl font-black text-slate-900">Create New Group</h1>
                <p class="text-slate-500">Define the group name and presentation slot.</p>
            </header>

            <form id="add-group-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Group Name</label>
                    <input type="text" id="groupName" placeholder="e.g. Cyber Ninjas" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-600 transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Presentation Day</label>
                    <select id="groupDay" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-600 transition">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>

                <div class="pt-6">
                    <button type="button" onclick="handleCreateGroup()" class="w-full bg-indigo-600 text-white py-5 rounded-[2rem] font-bold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition">
                        Save Group & Schedule
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="../shared/js/data-store.js"></script>
    <script src="admin-core.js"></script>
</body>
</html>
